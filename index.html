<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anne ile İngilizce Öğreniyorum — 600 Cümle</title>
<style>
:root{
  --paper:#F1EADB;
  --paper-line:#E4DAC3;
  --ink-navy:#1F3350;
  --ink-red:#8B2E2E;
  --line:#D8CCAF;
  --text:#2A2620;
  --muted:#7A7264;
  --good:#5B7553;
  --good-bg:#EFF3EA;
  --good-border:#B7CBA8;
  --bad-bg:#F7EBEA;
  --bad-border:#DDB6B0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  background-image:repeating-linear-gradient(var(--paper), var(--paper) 34px, var(--paper-line) 35px);
  font-family:Georgia,'Times New Roman',serif;
  color:var(--text);
  padding-bottom:60px;
}
.hidden{display:none !important;}

/* ---- top bar ---- */
#topbar{
  position:sticky; top:0; z-index:10;
  background:#EDE4D0;
  border-bottom:3px double var(--ink-navy);
  box-shadow:0 2px 6px rgba(31,51,80,0.08);
}
#topbar-inner{
  max-width:760px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
#brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
#brand-mark{
  font-weight:700; font-size:20px; color:#fff; background:var(--ink-red);
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; letter-spacing:-1px;
}
#brand-title{font-size:15px; font-weight:700; color:var(--ink-navy); line-height:1.2;}
#brand-sub{font-size:12px; color:var(--muted); margin-top:2px;}
#progress-track{flex:1; min-width:100px; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
#progress-fill{height:100%; background:linear-gradient(90deg,var(--ink-red),#B0524F); transition:width .5s ease; width:0%;}
.nav-btn{
  background:transparent; border:1px solid var(--line); border-radius:4px;
  padding:7px 12px; font-size:12.5px; font-family:Georgia,serif; color:var(--text);
  cursor:pointer;
}
.nav-btn:hover{background:#fff;}

#container{max-width:760px; margin:0 auto; padding:24px 20px;}

/* ---- generic panel/card ---- */
.panel{
  background:#fff; border:1px solid var(--line); border-radius:4px;
  padding:28px 24px; box-shadow:2px 3px 0 rgba(31,51,80,0.06);
}
.panel-title{font-size:21px; font-weight:700; color:var(--ink-navy); margin:0 0 8px 0;}
.panel-text{font-size:14px; color:var(--text); line-height:1.6; margin-bottom:16px;}
.subheading{font-size:15px; font-weight:700; color:var(--ink-navy); margin:24px 0 10px 0;}

/* ---- home ---- */
.hero{
  display:flex; align-items:center; gap:24px; background:#fff;
  border:1px solid var(--line); border-radius:4px; padding:28px;
  margin-bottom:20px; box-shadow:2px 3px 0 rgba(31,51,80,0.06); flex-wrap:wrap;
}
.hero-left{flex:1 1 280px;}
.hero-eyebrow{font-size:11px; letter-spacing:1.5px; color:var(--ink-red); font-weight:700; margin-bottom:6px; text-transform:uppercase;}
.hero-title{font-size:26px; font-weight:700; color:var(--ink-navy); margin:0 0 8px 0;}
.hero-desc{font-size:14.5px; color:var(--text); line-height:1.6; margin-bottom:4px;}
.hero-buttons{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
.daily-count-row{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--muted);}
.daily-count-select{
  font-family:Georgia,serif; font-size:12.5px; color:var(--text);
  border:1px solid var(--line); border-radius:4px; padding:4px 8px; background:#fff; cursor:pointer;
}
.daily-count-warning{
  font-size:11.5px; color:var(--ink-red); margin-top:6px; line-height:1.5;
  font-style:italic; max-width:420px;
}
.hero-right{flex:0 0 auto;}

.ring-label{font-size:12px; color:var(--muted); margin-top:4px; font-weight:600; text-align:center;}

.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
.stat-card{
  background:#fff; border:1px solid var(--line); border-top:4px solid; border-radius:4px;
  padding:16px 14px; text-align:left; cursor:pointer; font-family:Georgia,serif;
}
.stat-card-value{font-size:26px; font-weight:700; line-height:1;}
.stat-card-title{font-size:13px; font-weight:700; color:var(--text); margin-top:8px;}
.stat-card-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

.stage-row{display:flex; flex-direction:column; gap:8px;}
.build-version-tag{margin-top:18px; font-size:10.5px; color:var(--line); text-align:center;}
.stage-pill{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px 14px;}
.stage-pill.active{border-color:var(--ink-red); background:#FBF3EC;}
.stage-pill-num{width:26px; height:26px; border-radius:50%; background:var(--ink-navy); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.stage-pill-name{flex:0 0 160px; font-size:13px; font-weight:700; color:var(--text);}
.stage-pill-bar{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
.stage-pill-fill{height:100%; background:var(--ink-red);}
.stage-pill-count{font-size:11.5px; color:var(--muted); flex-shrink:0; min-width:44px; text-align:right;}
.stage-pill-review-btn{
  flex-shrink:0; font-family:Georgia,serif; font-size:11px; font-weight:700;
  background:#fff; color:var(--ink-navy); border:1.5px solid var(--ink-navy);
  border-radius:4px; padding:5px 10px; cursor:pointer; white-space:nowrap;
}
.stage-pill-review-btn:hover{background:var(--ink-navy); color:#fff;}

/* ---- lesson / card ---- */
.lesson-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
.lesson-breadcrumb{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
.lesson-counter{font-size:13px; font-weight:700; color:var(--ink-red);}
.lesson-exit-row{margin-bottom:8px;}
.lesson-exit-link{
  background:none; border:none; padding:0; font-family:Georgia,serif; font-size:12.5px;
  color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}
.lesson-exit-link:hover{color:var(--ink-navy);}

.teach-card{border:1px solid var(--line); border-radius:4px; padding:22px 20px; background:#FEFCF6;}
.card-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; display:block; margin-bottom:4px;}
.card-en{font-size:24px; font-weight:700; color:var(--ink-navy); line-height:1.3;}

/* ---- speak button (seslendirme) ---- */
.speak-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  background:#fff; border:1.5px solid var(--ink-navy); color:var(--ink-navy);
  font-size:15px; cursor:pointer; flex-shrink:0; vertical-align:middle;
  transition:background .15s ease, transform .1s ease;
}
.speak-btn:hover{background:#EDE4D0;}
.speak-btn:active{transform:scale(0.92);}
.speak-btn.speaking{background:var(--ink-red); border-color:var(--ink-red); color:#fff; animation:pulse 0.6s ease-in-out infinite alternate;}
@keyframes pulse{ from{opacity:1;} to{opacity:.6;} }
.speak-btn-sm{width:26px; height:26px; font-size:12px;}
.card-en-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pattern-row-with-speak{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.pattern-en-wrap{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}

.answer-input-row{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.answer-input-row .text-input{flex:1; margin-bottom:0;}
.mic-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  background:#fff; border:1.5px solid var(--ink-navy); color:var(--ink-navy);
  font-size:18px; cursor:pointer; transition:background .15s ease, transform .1s ease;
}
.mic-btn:hover{background:#EDE4D0;}
.mic-btn:active{transform:scale(0.92);}
.mic-btn.mic-listening{background:var(--ink-red); border-color:var(--ink-red); color:#fff; animation:pulse 0.6s ease-in-out infinite alternate;}
.browse-en-row{display:flex; align-items:center; gap:8px;}
.feedback-answer-row{display:flex; align-items:center; gap:10px;}
.card-divider{height:1px; background:var(--line); margin:14px 0;}
.card-field{margin-bottom:14px;}
.card-tr{font-size:17px; color:var(--text); font-weight:600;}
.card-pron{font-size:15px; color:var(--ink-red); font-style:italic;}
.word-list{display:flex; flex-direction:column; gap:4px;}
.word-item{display:flex; gap:6px; font-size:13.5px;}
.word-en{font-weight:700; color:var(--ink-navy); min-width:70px;}
.word-dash{color:var(--muted);}
.card-usage{font-size:13.5px; color:var(--text); line-height:1.6; font-style:italic;}

.pattern-box{background:var(--paper); border-radius:4px; padding:14px 16px; margin:4px 0 18px 0; border:1px dashed var(--line);}
.pattern-title{font-size:11.5px; font-weight:700; color:var(--ink-red); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
.pattern-row{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--line);}
.pattern-row:last-child{border-bottom:none;}
.pattern-en{font-weight:600; color:var(--text);}
.pattern-tr{color:var(--muted); flex-shrink:0;}

/* ---- Recognize fazı: çoktan seçmeli tanıma ---- */
.choice-list{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
.choice-btn{
  text-align:left; font-family:Georgia,serif; font-size:14.5px; color:var(--text);
  background:#fff; border:2px solid var(--line); border-radius:4px; padding:12px 14px;
  cursor:pointer; transition:border-color .12s ease, background .12s ease;
}
.choice-btn:hover:not(:disabled){border-color:var(--ink-navy); background:#FBF8F0;}
.choice-btn:disabled{cursor:default;}
.choice-correct{border-color:var(--good) !important; background:var(--good-bg) !important; font-weight:700;}
.choice-wrong{border-color:var(--ink-red) !important; background:var(--bad-bg) !important;}

/* ---- Build fazı: kelime dizme (tap the tiles) ---- */
.build-answer-row{
  min-height:52px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:12px 14px; margin-bottom:16px; background:#F8F4E9;
  border:2px dashed var(--line); border-radius:4px;
}
.build-placeholder{font-size:13px; color:var(--muted); font-style:italic;}
.build-bank{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.tile-btn{
  font-family:Georgia,serif; font-size:14.5px; font-weight:600; color:var(--ink-navy);
  background:#fff; border:2px solid var(--ink-navy); border-radius:4px; padding:8px 14px;
  cursor:pointer; transition:transform .1s ease;
}
.tile-btn:hover:not(:disabled){background:#EDE4D0;}
.tile-btn:active:not(:disabled){transform:scale(0.95);}
.tile-btn:disabled{opacity:.6; cursor:default;}
.tile-used{background:var(--ink-navy); color:#fff;}

.recall-hint{font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.5;}
.text-input{
  width:100%; font-size:16px; padding:12px 14px; border:2px solid var(--line);
  border-radius:4px; font-family:Georgia,serif; background:#fff; margin-bottom:12px; color:var(--text);
}
.text-input:focus{outline:none; border-color:var(--ink-navy);}

.feedback-box{border-radius:4px; padding:16px; margin-top:10px;}
.feedback-good{background:var(--good-bg); border:1px solid var(--good-border);}
.feedback-bad{background:var(--bad-bg); border:1px solid var(--bad-border);}
.feedback-answer{font-size:19px; font-weight:700; color:var(--ink-navy); margin-bottom:4px;}
.feedback-label{font-size:13px; color:var(--text); margin-bottom:12px;}

.done-stamp{font-size:40px; color:var(--good); text-align:center; margin-bottom:6px;}
.done-list{display:flex; flex-direction:column; gap:8px; margin:18px 0; max-height:300px; overflow-y:auto;}
.done-item{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:8px 10px; background:#F8F4E9; border-radius:4px;}
.done-item-en{font-weight:700; color:var(--ink-navy);}
.done-item-tr{color:var(--muted);}

/* ---- mistakes ---- */
.mistake-list{display:flex; flex-direction:column; gap:10px;}
.mistake-card{display:flex; gap:14px; align-items:flex-start; border:1px solid var(--line); border-radius:4px; padding:14px 16px; background:#FEFCF6;}
.mistake-count{font-size:18px; font-weight:700; color:var(--ink-red); min-width:34px;}
.mistake-body{flex:1;}
.mistake-en{font-size:15.5px; font-weight:700; color:var(--ink-navy);}
.mistake-tr{font-size:13.5px; color:var(--muted); margin-top:2px;}
.mistake-your{font-size:12px; color:var(--ink-red); margin-top:6px; font-style:italic;}

/* ---- stats ---- */
.stage-detail-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
.stage-detail-row{display:flex; align-items:center; gap:12px;}
.stage-detail-name{flex:0 0 190px; font-size:13px; font-weight:600; color:var(--text);}
.stage-detail-bar-track{flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
.stage-detail-bar-fill{height:100%; background:var(--ink-navy);}
.stage-detail-count{font-size:12px; color:var(--muted); min-width:44px; text-align:right;}

/* ---- browse ---- */
.stage-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.stage-tab{
  width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:700; color:var(--text); cursor:pointer; font-family:Georgia,serif;
}
.stage-tab.active{background:var(--ink-navy); color:#fff; border-color:var(--ink-navy);}
.browse-list{display:flex; flex-direction:column; gap:6px; max-height:480px; overflow-y:auto; margin-bottom:18px;}
.browse-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line);}
.browse-id{font-size:11px; color:var(--muted); min-width:28px; font-weight:700;}
.browse-body{flex:1;}
.browse-en{font-size:14px; font-weight:600; color:var(--text);}
.browse-tr{font-size:12px; color:var(--muted);}
.browse-check{color:var(--good); font-weight:700; font-size:15px;}

/* ---- buttons ---- */
.btn-primary{
  background:var(--ink-red); color:#fff; border:none; border-radius:4px; padding:12px 22px;
  font-size:14.5px; font-weight:700; cursor:pointer; font-family:Georgia,serif;
  box-shadow:1px 2px 0 rgba(139,46,46,0.3);
}
.btn-primary:disabled{opacity:.5; cursor:not-allowed;}
.btn-secondary{
  background:#fff; color:var(--ink-navy); border:2px solid var(--ink-navy); border-radius:4px;
  padding:10px 20px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:Georgia,serif;
}
.btn-ghost{
  background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:4px;
  padding:10px 20px; font-size:13.5px; cursor:pointer; font-family:Georgia,serif;
}

/* ---- loading ---- */
#loading-screen{min-height:100vh; display:flex; align-items:center; justify-content:center;}
#loading-pen{font-size:40px; margin-bottom:8px; color:var(--ink-red); text-align:center;}
#loading-text{font-size:15px; color:var(--muted); text-align:center;}

@media (max-width:480px){
  .hero{flex-direction:column;}
  .hero-right{align-self:center;}
  .stage-pill-name{flex:0 0 110px; font-size:12px;}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div>
    <div id="loading-pen">✎</div>
    <div id="loading-text">Defter açılıyor…</div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <div id="topbar-inner">
      <div id="brand" onclick="goHome()">
        <div id="brand-mark">600</div>
        <div>
          <div id="brand-title">Anne ile İngilizce Öğreniyorum</div>
          <div id="brand-sub"><span id="brand-count">0</span>/600 cümle · %<span id="brand-pct">0</span></div>
        </div>
      </div>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <button class="nav-btn" onclick="exportProgress()" title="İlerlemeni dosyaya kaydet">Yedekle</button>
      <button class="nav-btn" onclick="triggerImport()" title="Yedekten geri yükle">Geri Yükle</button>
      <input type="file" id="import-file" accept=".json" class="hidden" onchange="importProgress(event)">
    </div>
  </div>

  <div id="container">
    <div id="view-home"></div>
    <div id="view-lesson" class="hidden"></div>
    <div id="view-practice" class="hidden"></div>
    <div id="view-mistakes" class="hidden"></div>
    <div id="view-stats" class="hidden"></div>
    <div id="view-browse" class="hidden"></div>
  </div>
</div>

<script>

tr":"Onu 2019'dan beri tanıyorum.","pron":"Ayv noun him sins tvventi nayntin.","words":[["known","tanıdı"],["since","-den beri"]],"usage":"'Since' başlangıç noktasını, 'for' süreyi belirtir."},{"id":307,"en":"How long have you lived here?","tr":"Ne kadar zamandır burada yaşıyorsun?","pron":"Hav long hev yu livd hiır?","words":[["How long","ne kadar süre"]],"usage":"Süre sorma kalıbı."},{"id":308,"en":"I was cooking when you called.","tr":"Sen aradığında yemek pişiriyordum.","pron":"Ay vaz kuking ven yu kold.","words":[["was cooking","pişiriyordu"],["when","-diğinde"]],"usage":"Past continuous: geçmişte devam eden bir eylem başka bir eylemle kesildi."},{"id":309,"en":"I was sleeping at midnight.","tr":"Gece yarısı uyuyordum.","pron":"Ay vaz sliping et midnayt.","words":[["sleeping","uyuyordu"],["midnight","gece yarısı"]],"usage":"Past continuous: belirli bir anda devam eden eylem."},{"id":310,"en":"While I was walking, it started to rain.","tr":"Yürürken yağmur yağmaya başladı.","pron":"Vayl ay vaz voking, it startid tu reyn.","words":[["While","-iken"],["started","başladı"]],"usage":"Uzun eylem (was walking) + kısa eylem (started) bir arada."},{"id":311,"en":"If it rains, I'll stay home.","tr":"Yağmur yağarsa evde kalırım.","pron":"İf it reynz, ayl stey hom.","words":[["If","eğer"],["rains","yağar"]],"usage":"Birinci koşul cümlesi (first conditional): gerçekçi gelecek durumu."},{"id":312,"en":"If I have time, I'll call you.","tr":"Vaktim olursa seni ararım.","pron":"İf ay hev taym, ayl kol yu.","words":[["have time","vakti olmak"]],"usage":"Aynı koşul yapısı: If + present, will + fiil."},{"id":313,"en":"If you need anything, just ask.","tr":"Bir şeye ihtiyacın olursa sadece sor.","pron":"İf yu nid enising, cast ask.","words":[["anything","herhangi bir şey"],["just ask","sadece sor"]],"usage":"Koşul cümlesi + öneri/teklif."},{"id":314,"en":"I would love to, but I'm busy.","tr":"Çok isterdim ama meşgulüm.","pron":"Ay vud lav tu, bat aym bizi.","words":[["would love to","çok isterdi"],["but","ama"]],"usage":"Kibar reddetme: istek belirtip sebep açıklama."},{"id":315,"en":"I would like to ask a favor.","tr":"Bir iyilik istemek istiyorum.","pron":"Ay vud layk tu ask e feyvır.","words":[["favor","iyilik"]],"usage":"Kibar rica kalıbı."},{"id":316,"en":"Could you do me a favor?","tr":"Benim için bir iyilik yapabilir misin?","pron":"Kud yu du mi e feyvır?","words":[["do a favor","iyilik yapmak"]],"usage":"Rica etme kalıbı."},{"id":317,"en":"I was wondering if you could help me.","tr":"Acaba bana yardım edebilir misin diye düşünüyordum.","pron":"Ay vaz vandıring if yu kud help mi.","words":[["was wondering","merak ediyordu"]],"usage":"Çok kibar, dolaylı bir rica kalıbı."},{"id":318,"en":"I need to talk to you about something.","tr":"Seninle bir şey hakkında konuşmam gerek.","pron":"Ay nid tu tok tu yu ıbavt samsing.","words":[["need to","yapması gerekiyor"],["about","hakkında"]],"usage":"Önemli bir konuşmaya giriş yapma."},{"id":319,"en":"Can we talk for a minute?","tr":"Bir dakika konuşabilir miyiz?","pron":"Ken vi tok for e minit?","words":[["talk","konuşmak"]],"usage":"Kısa bir sohbete başlama teklifi."},{"id":320,"en":"Actually, I have a different opinion.","tr":"Aslında farklı bir görüşüm var.","pron":"Ekçuıli, ay hev e difrınt ıpinyın.","words":[["Actually","aslında"],["opinion","görüş, fikir"]],"usage":"Kibarca farklı fikir belirtme."},{"id":321,"en":"In my opinion, it's a good plan.","tr":"Bence bu iyi bir plan.","pron":"İn may ıpinyın, its e gud plen.","words":[["In my opinion","bence"]],"usage":"Fikir belirtirken kullanılan resmi kalıp."},{"id":322,"en":"As far as I know, the store is closed.","tr":"Bildiğim kadarıyla dükkan kapalı.","pron":"Ez far ez ay nou, dı stor iz klouzd.","words":[["As far as I know","bildiğim kadarıyla"]],"usage":"Kesin olmayan bilgi paylaşma."},{"id":323,"en":"To be honest, I don't like it.","tr":"Dürüst olmak gerekirse, hoşuma gitmiyor.","pron":"Tu bi anist, ay dont layk it.","words":[["To be honest","dürüst olmak gerekirse"]],"usage":"Doğrudan ama kibar açık sözlülük."},{"id":324,"en":"On the other hand, it could work.","tr":"Öte yandan, işe yarayabilir.","pron":"On dı adır hend, it kud vörk.","words":[["On the other hand","öte yandan"]],"usage":"Karşılaştırma yaparken kullanılan bağlaç."},{"id":325,"en":"By the way, did you finish the report?","tr":"Bu arada, raporu bitirdin mi?","pron":"Bay dı vey, did yu finiş dı riport?","words":[["By the way","bu arada"]],"usage":"Konuyu değiştirirken kullanılan geçiş ifadesi."},{"id":326,"en":"Speaking of which, I forgot to tell you.","tr":"Bahsi geçmişken, sana söylemeyi unuttum.","pron":"Spiking of viç, ay forgat tu tel yu.","words":[["Speaking of which","bahsi geçmişken"]],"usage":"Önceki konuya bağlanarak yeni bilgi ekleme."},{"id":327,"en":"That reminds me of something.","tr":"Bu bana bir şeyi hatırlattı.","pron":"Det rimaynz mi of samsing.","words":[["reminds","hatırlatıyor"]],"usage":"Hatırlatma bağlantısı kurma."},{"id":328,"en":"I totally agree with you.","tr":"Sana kesinlikle katılıyorum.","pron":"Ay toutıli ıgri vit yu.","words":[["totally","tamamen, kesinlikle"]],"usage":"Güçlü onaylama."},{"id":329,"en":"I see what you mean.","tr":"Ne demek istediğini anlıyorum.","pron":"Ay si vat yu min.","words":[["what you mean","ne demek istediğin"]],"usage":"Karşındakinin görüşünü anladığını belirtme."},{"id":330,"en":"That makes sense.","tr":"Bu mantıklı.","pron":"Det meyks sens.","words":[["makes sense","mantıklı geliyor"]],"usage":"Bir açıklamayı mantıklı bulma."},{"id":331,"en":"I'm not so sure about that.","tr":"Bundan pek emin değilim.","pron":"Aym nat sou şur ıbavt det.","words":[["so sure","o kadar emin"]],"usage":"Kibarca şüphe belirtme."},{"id":332,"en":"It depends on the weather.","tr":"Havaya bağlı.","pron":"İt dipendz on dı vedır.","words":[["depends on","bağlıdır"]],"usage":"Kesin olmayan durumları açıklama."},{"id":333,"en":"It's up to you.","tr":"Sana kalmış.","pron":"Its ap tu yu.","words":[["up to you" nfortunately","ne yazık ki"],["possible","mümkün"]],"usage":"Olumsuz haber verirken kullanılan resmi ifade."},{"id":345,"en":"I really appreciate your help.","tr":"Yardımın için gerçekten minnettarım.","pron":"Ay riıli ıprişieyt yor help.","words":[["appreciate","takdir etmek, minnettar olmak"]],"usage":"Güçlü bir teşekkür ifadesi."},{"id":346,"en":"Thanks for your understanding.","tr":"Anlayışın için teşekkürler.","pron":"Tenks for yor andırstending.","words":[["understanding","anlayış"]],"usage":"Anlayış gösteren birine teşekkür."},{"id":347,"en":"I owe you one.","tr":"Sana borçlandım.","pron":"Ay ov yu van.","words":[["owe","borçlu olmak"]],"usage":"Bir iyiliğe karşılık minnet gösterme (deyim)."},{"id":348,"en":"I'm sorry for the delay.","tr":"Gecikme için özür dilerim.","pron":"Aym sori for dı diley.","words":[["delay","gecikme"]],"usage":"Geç kalma için özür dileme."},{"id":349,"en":"I apologize for the inconvenience.","tr":"Sıkıntı için özür dilerim.","pron":"Ay ıpolocayz for dı inkınviniıns.","words":[["apologize","özür dilemek"],["inconvenience","rahatsızlık, sıkıntı"]],"usage":"Resmi özür dileme kalıbı."},{"id":350,"en":"It won't happen again.","tr":"Bir daha olmayacak.","pron":"İt vont hepın ıgeyn.","words":[["happen again","tekrar olmak"]],"usage":"Söz verme, tekrar etmeyeceğini belirtme."},{"id":351,"en":"My apologies.","tr":"Özürlerimi kabul edin.","pron":"May ıpolocıs.","words":[["apologies","özürler"]],"usage":"Kısa ve resmi özür."},{"id":352,"en":"That's my fault.","tr":"Bu benim hatam.","pron":"Dets may folt.","words":[["fault","hata, kusur"]],"usage":"Sorumluluk kabul etme."},{"id":353,"en":"It's not your fault.","tr":"Bu senin hatan değil.","pron":"Its nat yor folt.","words":[["not your fault","senin hatan değil"]],"usage":"Birini rahatlatma."},{"id":354,"en":"I should have called you.","tr":"Seni aramalıydım.","pron":"Ay şud hev kold yu.","words":[["should have","-meliydi (yapılmayan görev)"]],"usage":"Geçmişteki bir pişmanlığı belirtme."},{"id":355,"en":"I shouldn't have said that.","tr":"Bunu söylememeliydim.","pron":"Ay şudınt hev sed det.","words":[["shouldn't have","-memeliydi"]],"usage":"Pişmanlık belirtme, olumsuz."},{"id":356,"en":"I must go now.","tr":"Şimdi gitmem lazım.","pron":"Ay mast gou nav.","words":[["must","-meli, zorunlu olmak"]],"usage":"Güçlü zorunluluk belirtme."},{"id":357,"en":"I have to finish this today.","tr":"Bunu bugün bitirmem gerekiyor.","pron":"Ay hev tu finiş dis tudey.","words":[["have to","-meli, zorunda olmak"]],"usage":"Dışarıdan gelen zorunluluk belirtme."},{"id":358,"en":"You don't have to come.","tr":"Gelmen gerekmiyor.","pron":"Yu dont hev tu kam.","words":[["don't have to","gerekmiyor"]],"usage":"Zorunluluğun olmadığını belirtme."},{"id":359,"en":"You should see a doctor.","tr":"Bir doktora görünmelisin.","pron":"Yu şud si e daktır.","words":[["should","-meli (öneri)"]],"usage":"Tavsiye verme kalıbı."},{"id":360,"en":"You shouldn't smoke.","tr":"Sigara içmemelisin.","pron":"Yu şudınt smouk.","words":[["shouldn't","-memeli"]],"usage":"Olumsuz tavsiye."},{"id":361,"en":"You'd better hurry.","tr":"Acele etsen iyi olur.","pron":"Yud betır hari.","words":[["had better","-sen iyi olur"],["hurry","acele etmek"]],"usage":"Güçlü tavsiye/uyarı kalıbı."},{"id":362,"en":"It's not necessary.","tr":"Gerekli değil.","pron":"Its nat nesiseri.","words":[["necessary","gerekli"]],"usage":"Bir şeyin gereksizliğini belirtme."},{"id":363,"en":"It's worth trying.","tr":"Denemeye değer.","pron":"Its vörs traying.","words":[["worth","değer"]],"usage":"Bir eylemi tavsiye etme."},{"id":364,"en":"There's no point in waiting.","tr":"Beklemenin bir anlamı yok.","pron":"Ders nou poynt in veyting.","words":[["no point in","...-nin bir anlamı yok"]],"usage":"Bir eylemin anlamsızlığını belirtme."},{"id":365,"en":"I used to live in Ankara.","tr":"Eskiden Ankara'da yaşardım.","pron":"Ay yuzd tu liv in Ankara.","words":[["used to","eskiden -erdi"]],"usage":"Geçmişte olup artık olmayan alışkanlık/durum. // Veri setindeki 600 cümlenin tamamında geçen kısaltmalar (i'm, don't, what's...)
// ile bunların açık halleri (I am, do not, what is...) dilbilgisi olarak
// eşdeğerdir. Kullanıcı hangisini yazarsa yazsın doğru sayılmalı, bu yüzden
// normalize() karşılaştırma öncesi kısaltmaları açık hale çeviriyor.
// Not: "he's"/"she's"/"it's"/"that's"/"there's"/"here's" veri setinde HER
// zaman "is" anlamında kullanılmış (hiçbiri "has" değil), "you'd" ise tek
// kullanımında "had" anlamında ("You'd better hurry") — bu eşlemeler veri
// setindeki gerçek kullanım taranarak belirlendi, genel bir varsayım değil.
// "o'clock" bilinçli olarak dahil edilmedi: bu bir zaman birimi ifadesidir,
// "of the clock" şeklinde açılması doğal değildir.
const CONTRACTIONS = {
  "i'm":"i am", "you're":"you are", "we're":"we are",
  "it's":"it is", "that's":"that is", "there's":"there is",
  "what's":"what is", "here's":"here is", "how's":"how is",
  "she's":"she is", "he's":"he is", "nothing's":"nothing is", "sky's":"sky is",
  "i'll":"i will", "we'll":"we will", "you'll":"you will",
  "i've":"i have", "you've":"you have",
  "i'd":"i would", "you'd":"you had",
  "don't":"do not", "doesn't":"does not", "didn't":"did not",
  "can't":"cannot", "couldn't":"could not", "won't":"will not",
  "shouldn't":"should not", "isn't":"is not", "haven't":"have not",
  "let's":"let us",
};
// Bazı kısaltmaların apostrofsuz hali ("were", "its", "well", "ill" gibi)
// İngilizcede zaten geçerli, sık kullanılan başka bir kelimedir. Bu
// kısaltmalarda apostrofu ZORUNLU tutuyoruz — yoksa kullanıcı gerçekten o
// kelimeyi yazdığında (örn. "Where were we?" cümlesindeki "were") bunu
// yanlışlıkla bir kısaltma gibi açıp cümleyi bozarız. Diğer kısaltmalarda
// ("dont", "whats", "im" gibi) apostrofsuz hali anlamlı bir kelime
// olmadığı için apostrofu isteğe bağlı bırakmak güvenlidir ve kullanıcının
// apostrof unutmasını tolere eder.
// Not: "cant" (ikiyüzlü/dini jargon), "wont" (alışkanlık, arkaik), "id"
// (psikoloji terimi) teknik olarak gerçek kelimelerdir ama bu uygulamanın
// bağlamında (günlük konuşma cümleleri yazan bir dil öğrencisi) fiilen hiç
// karşılaşılmaz; bunları riskli saymak, gerçek faydası olan apostrof
// toleransını gereksiz yere kısıtlardı. "were", "its", "well", "ill" ise
// tartışmasız yaygın kelimelerdir ve risk listesinde kalmalıdır. "let's"
// de listede kalıyor çünkü "lets" (izin verir anlamında, örn. "the app
// lets you...") günlük kullanımda gerçekten karşılaşılabilir.
const CONTRACTIONS_REQUIRE_APOSTROPHE = new Set([
  "we're", "it's", "i'll", "we'll", "let's",
]);
function expandContractions(str){
  let result = str;
  // Apostrof karakteri düz (') veya eğik (' ’) olabilir — özellikle mobil
  // klavyeler ve otomatik düzeltme genelde eğik apostrof üretir. Regex'te
  // ikisini de kapsayan bir karakter sınıfı kullanıyoruz, yoksa "I'm"
  // (eğik apostroflu) tanınmadan geçip yanlış sonuca yol açar.
  const APOSTROPHE_CLASS = "['\u2018\u2019]";
  for(const [contraction, expansion] of Object.entries(CONTRACTIONS)){
    const mustHaveApostrophe = CONTRACTIONS_REQUIRE_APOSTROPHE.has(contraction);
    const apostropheGroup = mustHaveApostrophe ? APOSTROPHE_CLASS : APOSTROPHE_CLASS+"?";
    const pattern = contraction.replace(/'/g, apostropheGroup);
    result = result.replace(new RegExp("\\b"+pattern+"\\b","gi"), expansion);
  }
  return result;
}
function normalize(str){
  return expandContractions(str.toLowerCase().trim())
    .replace(/[.!?,]/g,"")
    .replace(/['’]/g,"") // kalan apostroflar (o'clock gibi) için farkı yok say
    .replace(/\s+/g," ");
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// Bir metni, HTML onclick="..." özniteliği İÇİNE güvenle gömülebilecek
// tek-tırnaklı bir JS string literaline çevirir. Hem JS kaçışlarını
// (\, ', satır sonları) hem de HTML özniteliği kaçışlarını (" ve &) uygular.
function jsStr(str){
  const jsEscaped = String(str)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "");
  const htmlSafe = jsEscaped.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  return "'" + htmlSafe + "'";
}

   ============================================================ */
const speechSupported = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
let cachedEnglishVoice = null;
let voicesReady = false;
// Otomatik (gecikmeli) ses çağrılarını (teach fazı, recall/practice feedback'i) takip eder.
// Kullanıcı bir sonraki karta/faza çok hızlı geçerse, önceki fazdan kalan
// bekleyen otomatik ses çağrısı iptal edilir; yoksa yanlış anda, yanlış
// cümleyi seslendirip kafa karıştırabilirdi (bkz. pendingAutoSpeakTimer kullanımları).
let pendingAutoSpeakTimer = null;
function scheduleAutoSpeak(text, btnElGetter, delay){
  clearTimeout(pendingAutoSpeakTimer);
  pendingAutoSpeakTimer = setTimeout(() => {
    const btnEl = typeof btnElGetter === "function" ? btnElGetter() : btnElGetter;
    speak(text, btnEl);
  }, delay);
}

function primeVoices(){
  if(!speechSupported) return;
  const voices = window.speechSynthesis.getVoices();
  if(voices && voices.length > 0){
    cachedEnglishVoice =
      voices.find(v => v.lang === "en-US") ||
      voices.find(v => v.lang === "en-GB") ||
      voices.find(v => v.lang && v.lang.startsWith("en")) ||
      null;
    voicesReady = true;
  }
}
if(speechSupported){
  primeVoices();
  // Çoğu tarayıcıda sesler asenkron yükleniyor; hazır olunca tekrar dene.
  if("onvoiceschanged" in window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = primeVoices;
  }
}

function speak(text, btnEl){
  if(!speechSupported){
    alert("Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü deneyebilirsin.");
    return;
  }
  if(!voicesReady) primeVoices();

  window.speechSynthesis.cancel(); // önceki konuşma varsa kes, üst üste binmesin

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = cachedEnglishVoice ? cachedEnglishVoice.lang : "en-US";
  if(cachedEnglishVoice) utter.voice = cachedEnglishVoice;
  utter.rate = 0.9; // öğrenci için biraz yavaş
  utter.pitch = 1;

  if(btnEl){
    btnEl.classList.add("speaking");
    utter.onend = () => btnEl.classList.remove("speaking");
    utter.onerror = () => btnEl.classList.remove("speaking");
  }
  window.speechSynthesis.speak(utter);
}

/* ============================================================
   KONUŞMA TANIMA (Web Speech API — SpeechRecognition, konuşmadan metne)
   ============================================================ */
// Chrome/Edge (Chromium) ve Safari'de webkitSpeechRecognition prefix'iyle
// mevcut; Firefox'ta yok. Bulunamıyorsa mikrofon butonu hiç gösterilmez,
// kullanıcı sorunsuz şekilde klavyeyle yazmaya devam eder.
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechRecognitionSupported = !!SpeechRecognitionAPI;
let activeRecognition = null; // aynı anda birden fazla dinleme başlamasın diye

// onResult(transcript): tanınan metni alacak geri çağırım.
// onStateChange(state): "listening" | "idle" | "error" — buton görselini güncellemek için.
function startVoiceInput(onResult, onStateChange){
  if(!speechRecognitionSupported){
    if(onStateChange) onStateChange("error");
    return;
  }
  if(activeRecognition){
    // zaten dinliyorsa tekrar tıklanmışsa durdur (aç/kapa davranışı)
    activeRecognition.stop();
    return;
  }
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = "en-US";
  recognition.interimResults = false; // sadece kesin sonucu al, ara tahminleri gösterme
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { if(onStateChange) onStateChange("listening"); };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if(onResult) onResult(transcript);
  };
  recognition.onerror = () => { if(onStateChange) onStateChange("error"); };
  recognition.onend = () => {
    activeRecognition = null;
    if(onStateChange) onStateChange("idle");
  };

  activeRecognition = recognition;
  try{
    recognition.start();
  }catch(e){
    // Bazı tarayıcılarda üst üste hızlı start() çağrıları hata fırlatabilir;
    // sessizce idle durumuna dön, kullanıcı tekrar deneyebilir.
    activeRecognition = null;
    if(onStateChange) onStateChange("error");
  }
}

function getNextNewId(){
  for(let i=1;i<=600;i++){ if(!progress.learned[i]) return i; }
  return 601;
}
function getCurrentStageIndex(){
  const nextId = getNextNewId();
  const idx = stageOf(Math.min(nextId,600));
  return idx === -1 ? STAGES.length-1 : idx;
}
function getDueReviews(){
  const today = todayStr();
  const due = [];
  for(const idStr of Object.keys(progress.learned)){
    const rec = progress.learned[idStr];
    if(rec.nextReview && rec.nextReview <= today) due.push(Number(idStr));
  }
  return due.sort((a,b)=>a-b);
}
// SM-2 algoritması (Anki/SuperMemo'nun kullandığı, 1987'den beri kanıtlanmış
// aralıklı tekrar yöntemi). Sabit bir merdiven yerine her cümlenin kendi
// "ease factor"ü (kolaylık katsayısı) tutulur: sürekli doğru bilinen bir
// cümlenin ease'i yükselir ve aralığı katlanarak açılır (1→6→15→37 gün gibi,
// cümleye özel); sık yanlış yapılan bir cümlenin ease'i düşer ve aralığı kısa
// kalıp sık tekrar eder. Böylece 600 cümlenin her biri kendi zorluk geçmişine
// göre kişisel bir hızda ilerler, hepsi aynı sabit merdivende yürümez.
const SM2_INITIAL_EASE = 2.5;
const SM2_MIN_EASE = 1.3;
const SM2_EASE_BONUS_CORRECT = 0.15;
const SM2_EASE_PENALTY_WRONG = 0.2;
function scheduleNext(rec, wasCorrect){
  let ease = rec.ease || SM2_INITIAL_EASE;
  let interval = rec.interval || 0; // gün cinsinden mevcut aralık
  let repetitions = rec.repetitions || 0; // art arda doğru sayısı

  if(wasCorrect){
    ease = ease + SM2_EASE_BONUS_CORRECT;
    repetitions += 1;
    if(repetitions === 1) interval = 1;
    else if(repetitions === 2) interval = 6;
    else interval = Math.round(interval * ease);
  } else {
    ease = Math.max(SM2_MIN_EASE, ease - SM2_EASE_PENALTY_WRONG);
    repetitions = 0;
    interval = 0; // yanlış bilinen cümle aynı gün (bugün) tekrar kuyruğuna düşer
  }

  const next = new Date();
  next.setDate(next.getDate() + interval);
  return {
    ease, interval, repetitions,
    nextReview: next.toISOString().slice(0,10),
  };
}
function getPatternSiblings(id){
  const s = findSentence(id);
  if(!s) return [];
  const patternStarters = ["i want","i need","i have","i'm","can you","i feel","this is","i like","let's","i'll"];
  const enLower = s.en.toLowerCase();
  const matchedStarter = patternStarters.find(p => enLower.startsWith(p));
  if(!matchedStarter) return [];
  return SENTENCES.filter(o => o.id !== id && o.en.toLowerCase().startsWith(matchedStarter) && Math.abs(o.id-id) < 60).slice(0,2);
}

function exportProgress(){
  const blob = new Blob([JSON.stringify(progress, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ingilizce600_yedek_" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById("import-file").click();
}
function importProgress(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.learned) throw new Error("Geçersiz dosya");
      if(confirm("Mevcut ilerlemenin üzerine yedekteki ilerleme yüklenecek. Devam edilsin mi?")){
        progress = Object.assign(defaultProgress(), parsed);
        saveProgress();
        renderAll();
        alert("İlerleme başarıyla geri yüklendi.");
      }
    }catch(err){
      alert("Bu dosya okunamadı. Geçerli bir yedek dosyası seçtiğinden emin ol.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function initLesson(){
  clearTimeout(pendingAutoSpeakTimer); // başka bir ekrandan (örn. Practice) kalan bekleyen ses varsa iptal
  const startId = getNextNewId();
  const dailyCount = (progress.settings && progress.settings.dailyNewCount) || 8;
  const ids = [];
  for(let i=startId; i<startId+dailyCount && i<=600; i++) ids.push(i);
  lessonState = { mode:"new", ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null };
  renderLesson();
}

// Tamamlanmış bir aşamayı, ilerlemeye (progress.learned / spaced-repetition
// takvimine) DOKUNMADAN yeniden Ders akışından (teach->recognize->build->recall)
// geçirmek için kullanılır. stageIdx: STAGES dizisindeki 0-tabanlı indeks.
function startStageReview(stageIdx){
  clearTimeout(pendingAutoSpeakTimer);
  const stage = STAGES[stageIdx];
  const ids = [];
  for(let i=stage.from; i<=stage.to; i++) ids.push(i);
  lessonState = { mode:"review", stageIdx, ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null };
  setView("lesson", true); // true: initLesson() atlanır, lessonState üzerine yazılmaz
}

// Zayıf Noktalar listesindeki tüm cümleleri (en çok hata yapılandan aza
// doğru) Ders akışıyla (teach->recognize->build->recall) çalıştırır.
// "review" modu gibi progress.learned'ın tekrar takvimine dokunmaz, ama
// ondan farklı olarak: recall'da DOĞRU cevaplanan bir cümle mistakes
// listesinden tamamen SİLİNİR (gerçek "tamamlama" hissi vermek için).
// Yanlış cevaplanırsa mevcut mekanizma zaten count'u artırır, liste kalır.
function startMistakesReview(){
  clearTimeout(pendingAutoSpeakTimer);
  const ids = Object.keys(progress.mistakes)
    .map(Number)
    .sort((a,b) => (progress.mistakes[b].count - progress.mistakes[a].count));
  if(ids.length === 0) return; // buton zaten sadece liste doluyken gösteriliyor, ekstra güvenlik
  lessonState = { mode:"mistakes", ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null, mistakesResolvedCount:0 };
  setView("lesson", true);
}

    scheduleAutoSpeak(sentence.en, () => document.getElementById('teach-main-speak-btn'), 150);

  }

  if(phase === "recognize"){
    // Isınma turu: kullanıcı henüz yazmaya zorlanmadan, doğru Türkçe anlamı
    // çoktan seçmeli olarak tanısın. Duolingo/Memrise'deki "mark the correct
    // meaning" adımının karşılığı — tam üretimden önceki düşük çabalı adım.
    if(!lessonState.recognizeOptions){
      lessonState.recognizeOptions = buildRecognizeOptions(sentence);
      lessonState.recognizeSelected = null;
    }
    const opts = lessonState.recognizeOptions;
    const selected = lessonState.recognizeSelected;

    let optsHtml = "";
    opts.forEach((opt, i) => {
      let cls = "choice-btn";
      if(selected !== null){
        if(opt.isCorrect) cls += " choice-correct";
        else if(i === selected) cls += " choice-wrong";
      }
      optsHtml += `<button class="${cls}" ${selected!==null?"disabled":""} onclick="lessonCheckRecognize(${i})">${escapeHtml(opt.text)}</button>`;
    });

    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>

        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">Bu cümle Türkçe ne demek?</span>
        <div class="card-en-row">
          <div class="card-en" style="font-size:20px">${escapeHtml(sentence.en)}</div>
          <button class="speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
        </div>
        <div class="choice-list">${optsHtml}</div>
        ${selected !== null ? `<button class="btn-primary" onclick="lessonGoToBuild()">Devam Et</button>` : ""}
      </div>`;
    return;
  }

  if(phase === "build"){
    // Orta adım: cümleyi karışık kelime parçalarından doğru sıraya dizmek.
    // Boş bir kutuya yazmadan önce cümle yapısını "inşa ederek" içselleştirme —
    // Duolingo'nun "arrange all the words" egzersiziyle aynı mantık.
    if(!lessonState.buildTiles){
      const built = buildWordTiles(sentence.en);
      lessonState.buildTiles = built.tiles;       // karışık sıradaki kelime parçaları [{id,text,used}]
      lessonState.buildAnswer = [];                 // kullanıcının seçtiği sıradaki tile id'leri
      lessonState.buildCorrectOrder = built.correctOrder;
      lessonState.buildFeedback = null;
    }
    const tiles = lessonState.buildTiles;
    const answer = lessonState.buildAnswer;
    const fb = lessonState.buildFeedback;

    const answerRowHtml = answer.length === 0
      ? `<span class="build-placeholder">Kelimelere dokunarak cümleyi buraya sırayla diz…</span>`
      : answer.map(tid => {
          const t = tiles.find(x => x.id === tid);
          return `<button class="tile-btn tile-used" onclick="lessonRemoveTile(${tid})" ${fb?"disabled":""}>${escapeHtml(t.text)}</button>`;
        }).join(" ");

    const bankHtml = tiles.filter(t => !answer.includes(t.id)).map(t =>
      `<button class="tile-btn" onclick="lessonAddTile(${t.id})" ${fb?"disabled":""}>${escapeHtml(t.text)}</button>`
    ).join(" ");

    let feedbackHtml = "";
    if(fb){
      const cls = fb === "correct" ? "feedback-good" : "feedback-bad";
      const label = fb === "correct" ? "Doğru sırada! 👍" : "Doğru sıralama bu — bir dahaki sefere dikkat et.";
      feedbackHtml = `
        <div class="feedback-box ${cls}">
          <div class="feedback-answer-row">
            <div class="feedback-answer">${escapeHtml(sentence.en)}</div>
            <button class="speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
          </div>
          <div class="feedback-label">${label}</div>
          <button class="btn-primary" onclick="lessonGoToRecall()">Şimdi Kendin Yaz</button>
        </div>`;
    }

    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
      <div class="lesson-head">
        <div class="lesson-breadcrumb">Aşama ${stageIdx+1} · ${escapeHtml(stage.name)} · Cümle Dizme${modeTag}</div>
        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">Türkçesi</span>
        <div class="card-tr" style="margin-bottom:14px">${escapeHtml(sentence.tr)}</div>
        <p class="recall-hint">Kelimeleri doğru sırada seçerek İngilizce cümleyi oluştur.</p>
        <div class="build-answer-row">${answerRowHtml}</div>
        <div class="build-bank">${bankHtml}</div>
        ${!fb ? `
          <div class="hero-buttons">
            <button class="btn-primary" onclick="lessonCheckBuild()" ${answer.length===0?"disabled":""}>Kontrol Et</button>
            <button class="btn-ghost" onclick="lessonResetBuild()">Baştan Başla</button>
          </div>` : ""}
        ${feedbackHtml}
      </div>`;
    return;
  }

  if(phase === "recall"){
    const fb = lessonState.feedback;
    let feedbackHtml = "";
    if(fb){
      const cls = fb === "correct" ? "feedback-good" : "feedback-bad";
      const label = fb === "correct" ? "Doğru! 👍" : (fb === "wrong" ? "Doğrusu bu — not edildi, tekrar karşına çıkacak." : "Cevap gösterildi.");
      const nextLabel = (idx+1 < ids.length) ? "Sıradaki Cümle" : "Dersi Bitir";
      feedbackHtml = `
        <div class="feedback-box ${cls}">
          <div class="feedback-answer-row">
            <div class="feedback-answer">${escapeHtml(sentence.en)}</div>
            <button class="speak-btn" id="recall-feedback-speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
          </div>
          <div class="feedback-label">${label}</div>
          <button class="btn-primary" onclick="lessonNextCard()">${nextLabel}</button>
        </div>`;
    }
    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
      <div class="lesson-head">
        <div class="lesson-breadcrumb">Aşama ${stageIdx+1} · ${escapeHtml(stage.name)}${modeTag}</div>
        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">Türkçesi</span>
        <div class="card-tr" style="margin-bottom:14px">${escapeHtml(sentence.tr)}</div>
        <p class="recall-hint">İngilizcesini yazmayı dene. Emin değilsen tahmin et, olmadı "Cevabı Göster"e bas.</p>
        <div class="answer-input-row">
          <input type="text" class="text-input" id="lesson-answer-input" placeholder="İngilizcesini buraya yaz…"
            value="${escapeHtml(lessonState.answer)}" ${fb ? "disabled" : ""}
            oninput="lessonState.answer=this.value; lessonSyncCheckBtn()" onkeydown="if(event.key==='Enter' && !lessonState.feedback) lessonCheckAnswer()">

      setTimeout(() => {

    } else {

      // otomatik duyur — kullanıcı yazdığı ile doğru okunuşu hemen karşılaştırabilsin.
      scheduleAutoSpeak(sentence.en, () => document.getElementById('recall-feedback-speak-btn'), 150);

  }

/* ---- Faz geçişleri ---- */
function lessonGoToRecognize(){

  lessonState.phase = "recognize";

}

/* ---- RECOGNIZE (çoktan seçmeli tanıma) ---- */
// Hedef cümlenin doğru Türkçesini, aynı aşamadan alınmış 3 yanlış seçenekle
// karıştırır. Yanlışlar aynı stage'den seçilir ki zorluk seviyesi tutarlı olsun
// (çok farklı bir aşamadan gelen çeviri bariz şekilde elenebilir olurdu).
function buildRecognizeOptions(sentence){
  const stageIdx = stageOf(sentence.id);
  const stage = STAGES[stageIdx];
  const pool = SENTENCES.filter(s => s.id !== sentence.id && s.id >= stage.from && s.id <= stage.to && s.tr !== sentence.tr);
  const wrongs = [];
  const poolCopy = pool.slice();
  while(wrongs.length < 3 && poolCopy.length > 0){
    const i = Math.floor(Math.random() * poolCopy.length);
    wrongs.push(poolCopy.splice(i,1)[0]);
  }
  const options = wrongs.map(w => ({ text: w.tr, isCorrect: false }));
  options.push({ text: sentence.tr, isCorrect: true });
  // Fisher-Yates karıştırma
  for(let i = options.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return options;
}
function lessonCheckRecognize(i){
  if(lessonState.recognizeSelected !== null) return; // zaten cevaplandı
  lessonState.recognizeSelected = i;
  renderLesson();
}

/* ---- BUILD (kelime dizme) ---- */
// Cümleyi kelimelere ayırıp karıştırır. Noktalama işaretlerini ayrı tile
// yapmadan kelimenin sonuna yapıştırıyoruz (örn. "water." tek parça) —
// yoksa nokta/soru işareti tek başına anlamsız bir parça olurdu.
function buildWordTiles(sentenceEn){
  const words = sentenceEn.split(" ").filter(w => w.length > 0);
  const tiles = words.map((w, i) => ({ id: i, text: w }));
  const correctOrder = tiles.map(t => t.id);
  // Karışık sırada göster (en az bir kelime yanlış konumdaysa yeterli;
  // tek kelimelik cümlelerde karıştırmaya gerek yok)
  const shuffled = tiles.slice();
  if(shuffled.length > 1){
    let attempts = 0;
    do{
      for(let i = shuffled.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      attempts++;
    } while(shuffled.every((t,i) => t.id === correctOrder[i]) && attempts < 10);
  }
  return { tiles: shuffled, correctOrder };
}
function lessonAddTile(tileId){
  if(lessonState.buildFeedback) return;
  lessonState.buildAnswer.push(tileId);
  renderLesson();
}
function lessonRemoveTile(tileId){
  if(lessonState.buildFeedback) return;
  const idx = lessonState.buildAnswer.lastIndexOf(tileId);
  if(idx !== -1) lessonState.buildAnswer.splice(idx, 1);
  renderLesson();
}
function lessonResetBuild(){
  if(lessonState.buildFeedback) return;
  lessonState.buildAnswer = [];
  renderLesson();
}
function lessonCheckBuild(){
  const isCorrect = lessonState.buildAnswer.length === lessonState.buildCorrectOrder.length &&
    lessonState.buildAnswer.every((id, i) => id === lessonState.buildCorrectOrder[i]);
  lessonState.buildFeedback = isCorrect ? "correct" : "wrong";
  renderLesson();
}

/* ---- RECALL (serbest yazma) — mevcut mantık, artık learned burada işaretleniyor ---- */
function lessonMarkLearned(id, wasCorrect){
  // Güvenlik: cümle daha önce öğrenilmişse (örn. ileride bu fonksiyon başka
  // bir yerden de çağrılırsa) üzerine yazıp ilerlemesini sıfırlamıyoruz.
  // Böylece bu invariant çağıran koda değil, fonksiyonun kendisine bağlı olur.
  if(progress.learned[id]) return;
  const today = todayStr();
  // İlk öğrenmede de scheduleNext ile aynı SM-2 mantığını kullanıyoruz:
  // doğru cevaplandıysa ilk tekrar 1 gün sonraya açılır (repetitions=1),
  // yanlış/gösterildiyse bugün (interval=0) kalır. Böylece Ders'teki ilk
  // cevap da Pratik'teki tekrarlarla aynı algoritmayla aralığı etkiliyor.
  const schedule = scheduleNext({}, !!wasCorrect); // boş rec: ease/interval/repetitions varsayılan başlangıç değerlerinden başlar
  progress.learned[id] = {
    firstLearned: today, ...schedule, correctStreak: wasCorrect ? 1 : 0, timesWrong: wasCorrect ? 0 : 1
  };
  if(!progress.dailyLog[today]) progress.dailyLog[today] = { newCount:0, reviewCount:0 };
  progress.dailyLog[today].newCount += 1;
  saveProgress();
  updateTopbar();
}

function lessonCheckAnswer(){
  const sentence = findSentence(lessonState.ids[lessonState.idx]);
  const correct = normalize(lessonState.answer) === normalize(sentence.en);
  lessonState.feedback = correct ? "correct" : "wrong";
  if(!correct){
    const m = progress.mistakes[sentence.id] || { count:0 };
    progress.mistakes[sentence.id] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: lessonState.answer };
  } else if(lessonState.mode === "mistakes"){
    // "Zayıf Noktaları Çalış" modunda doğru cevap = tamamlandı sayılır,
    // cümle listeden tamamen kalkar. Bu, sadece bir sonraki tekrarı
    // ertelemekten farklı: kullanıcı gerçekten "bitirdim" hissi alır.
    delete progress.mistakes[sentence.id];
    lessonState.mistakesResolvedCount = (lessonState.mistakesResolvedCount || 0) + 1;
  }
  // Sadece normal ("new") modda: recall adımına kadar geldiyse cümleyi
  // öğrenilmiş sayıp tekrar kuyruğuna ekliyoruz. Doğru cevap aralığı
  // 1 güne açar, yanlış cevap aynı gün (0) kademesinde tutar.
  // "review" (tamamlanmış aşamayı tekrar çalışma) ve "mistakes" (zayıf
  // noktaları çalışma) modlarında ise ilerlemeye ve spaced-repetition
  // takvimine HİÇ dokunmuyoruz — bu ikisi de serbest pratik, mevcut
  // tekrar programını bozmamalı.
  if(lessonState.mode === "new"){
    lessonMarkLearned(sentence.id, correct);
  }
  saveProgress();
  renderLesson();
}
function lessonReveal(){
  lessonState.feedback = "revealed";
  const sentence = findSentence(lessonState.ids[lessonState.idx]);
  // Cevap gösterildiyse kullanıcı bilmiyor demektir; yanlış cevap gibi ele
  // alıp aynı gün (0) kademesinde tutuyoruz ki cümle hemen tekrar karşısına
  // çıksın. Review/mistakes modlarında ise (yukarıdaki gerekçeyle) hiç
  // dokunmuyoruz. Not: mistakes modunda cevap gösterildiyse cümle listeden
  // SİLİNMEZ (kullanıcı gerçekten bilmiyordu, tamamlanmış sayılamaz).
  if(lessonState.mode === "new"){
    lessonMarkLearned(sentence.id, false);
  }
  saveProgress();
  renderLesson();
}
function lessonNextCard(){
  clearTimeout(pendingAutoSpeakTimer); // önceki karttan (recall feedback) kalan bekleyen ses varsa iptal
  lessonState.answer = "";
  lessonState.feedback = null;
  lessonState.recognizeOptions = null;
  lessonState.recognizeSelected = null;
  lessonState.buildTiles = null;
  if(lessonState.idx+1 < lessonState.ids.length){
    lessonState.idx += 1;
    lessonState.phase = "teach";
  }else{
    lessonState.phase = "done";
  }
  renderLesson();
}

   TEKRAR PRATİĞİ (AKTİF HATIRLAMA)
   ============================================================ */
function initPractice(){
  clearTimeout(pendingAutoSpeakTimer); // başka bir ekrandan (örn. Ders) kalan bekleyen ses varsa iptal
  const dueIds = getDueReviews();
  practiceState = { queue: dueIds.slice(), total: dueIds.length, correct:0, wrong:0, answer:"", feedback:null, canUndo:false, preAnswerRec:null, undoneId:null };
  renderPractice();
}

function renderPractice(){
  const el = document.getElementById("view-practice");
  if(!practiceState || practiceState.total === 0){
    el.innerHTML = `
      <div class="panel">
        <h2 class="panel-title">Şu an tekrar bekleyen cümle yok</h2>
        <p class="panel-text">Harika gidiyorsun — tüm tekrarlar güncel. Yeni ders alarak devam edebilirsin.</p>
        <button class="btn-primary" onclick="setView('lesson')">Yeni Derse Git</button>
      </div>`;
    return;
  }

  if(practiceState.queue.length === 0){
    const wrongBtn = practiceState.wrong > 0 ? `<button class="btn-secondary" onclick="setView('mistakes')">Zayıf Noktalara Bak</button>` : "";
    el.innerHTML = `
      <div class="panel">
        <div class="done-stamp">✓</div>
        <h2 class="panel-title" style="text-align:center">Tekrar Tamamlandı</h2>
        <p class="panel-text" style="text-align:center">${practiceState.correct} doğru, ${practiceState.wrong} yanlış. Yanlışların "Zayıf Noktalar" listesine eklendi.</p>
        <div class="hero-buttons">
          <button class="btn-primary" onclick="setView('home')">Ana Sayfa</button>
          ${wrongBtn}
        </div>
      </div>`;
    return;
  }

  const currentId = practiceState.queue[0];
  const sentence = findSentence(currentId);
  const fb = practiceState.feedback;

  let feedbackHtml = "";
  if(fb){
    const cls = (fb === "correct") ? "feedback-good" : (fb === "undone" ? "feedback-bad" : "feedback-bad");
    let label;
    if(fb === "correct") label = "Doğru! Tekrar aralığı uzatıldı.";
    else if(fb === "undone") label = "Düzeltildi — bu cümle artık yanlış sayıldı ve daha sık karşına çıkacak.";
    else label = "Bu cümle daha sık karşına çıkacak.";

    // Cevap "doğru" olarak işaretlendiyse ve henüz geri alınmadıysa, kullanıcı
    // fikrini değiştirip "aslında bilmiyordum" diyebilsin diye küçük bir link sunuyoruz.
    const undoLinkHtml = (fb === "correct" && practiceState.canUndo)
      ? `<button class="undo-correct-link" onclick="practiceUndoCorrect()">Aslında bilmiyordum, düzelt</button>`
      : "";

    feedbackHtml = `
      <div class="feedback-box ${cls}">
        <div class="feedback-answer-row">
          <div class="feedback-answer">${escapeHtml(sentence.en)}</div>
          <button class="speak-btn" id="practice-feedback-speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
        </div>
        <div class="feedback-label">${label}</div>
        ${undoLinkHtml}
        <button class="btn-primary" onclick="practiceNextItem()">Sıradaki</button>
      </div>`;
  }

  el.innerHTML = `
    <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
    <div class="lesson-head">
      <div class="lesson-breadcrumb">Tekrar Pratiği</div>
      <div class="lesson-counter">${practiceState.total - practiceState.queue.length + 1} / ${practiceState.total}</div>
    </div>
    <div class="teach-card">
      <span class="card-label">Türkçesi</span>
      <div class="card-tr" style="margin-bottom:14px">${escapeHtml(sentence.tr)}</div>
      <div class="answer-input-row">
        <input type="text" class="text-input" id="practice-answer-input" placeholder="İngilizcesini buraya yaz…"
          value="${escapeHtml(practiceState.answer)}" ${fb ? "disabled" : ""}
          oninput="practiceState.answer=this.value; practiceSyncCheckBtn()" onkeydown="if(event.key==='Enter' && !practiceState.feedback) practiceCheckAnswer()">
        ${(speechRecognitionSupported && !fb) ? `<button class="mic-btn" id="practice-mic-btn" onclick="practiceStartMic()" title="Konuşarak cevapla" aria-label="Konuşarak cevapla">🎤</button>` : ""}
      </div>
      ${!fb ? `
        <div class="hero-buttons">
          <button class="btn-primary" id="practice-check-btn" onclick="practiceCheckAnswer()">Kontrol Et</button>
          <button class="btn-ghost" onclick="practiceReveal()">Bilmiyorum</button>
        </div>` : ""}
      ${feedbackHtml}
    </div>`;

  if(!fb){
    setTimeout(() => {
      const inp = document.getElementById("practice-answer-input");
      if(inp) inp.focus();
      practiceSyncCheckBtn();
    },0);
  } else {
    // Ders akışındaki recall fazıyla tutarlı: doğru cevap gösterildiğinde
    // telaffuzu otomatik duyur.
    scheduleAutoSpeak(sentence.en, () => document.getElementById('practice-feedback-speak-btn'), 150);
  }
}

function practiceSyncCheckBtn(){
  const btn = document.getElementById("practice-check-btn");
  if(btn) btn.disabled = !practiceState.answer.trim();
}

function practiceStartMic(){
  const micBtn = document.getElementById("practice-mic-btn");
  startVoiceInput(
    (transcript) => {
      // Tanınan metni doğrudan cevap kutusuna yaz; kullanıcı isterse
      // gönderme öncesi elle düzeltebilir (STT %100 doğru olmayabilir).
      practiceState.answer = transcript;
      const inp = document.getElementById("practice-answer-input");
      if(inp) inp.value = transcript;
      practiceSyncCheckBtn();
    },
    (state) => {
      if(!micBtn) return;
      if(state === "listening") micBtn.classList.add("mic-listening");
      else micBtn.classList.remove("mic-listening");
      if(state === "error"){
        // Mikrofon izni reddedildiyse ya da tanıma başarısız olduysa sessizce
        // eski haline dön; kullanıcı klavyeyle yazmaya devam edebilir.
        micBtn.classList.remove("mic-listening");
      }
    }
  );
}

function practiceCheckAnswer(){
  const currentId = practiceState.queue[0];
  const sentence = findSentence(currentId);
  const correct = normalize(practiceState.answer) === normalize(sentence.en);
  practiceState.feedback = correct ? "correct" : "wrong";

  const rec = progress.learned[currentId] || {};
  // Cevap "doğru" çıkarsa, kullanıcı daha sonra "aslında bilmiyordum, şansa
  // denk geldi" diyip geri alabilsin diye, güncellemeden HEMEN ÖNCEKİ rec'i
  // ayrıca saklıyoruz. Geri alma, bu orijinal rec üzerinden "yanlış" olarak
  // yeniden zamanlanacak — böylece "doğruyu geri al, sonra yanlışı uygula"
  // gibi çift işlem yerine, hiç doğru cevaplanmamış gibi temiz bir hesaplama olur.
  practiceState.canUndo = correct;
  practiceState.preAnswerRec = correct ? Object.assign({}, rec) : null;
  practiceState.undoneId = correct ? currentId : null;

  const updatedSchedule = scheduleNext(rec, correct);
  progress.learned[currentId] = Object.assign({}, rec, updatedSchedule, {
    correctStreak: correct ? (rec.correctStreak||0)+1 : 0,
    timesWrong: correct ? (rec.timesWrong||0) : (rec.timesWrong||0)+1
  });

  if(!correct){
    const m = progress.mistakes[currentId] || { count:0 };
    progress.mistakes[currentId] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: practiceState.answer };
  }

  const today = todayStr();
  if(!progress.dailyLog[today]) progress.dailyLog[today] = { newCount:0, reviewCount:0 };
  progress.dailyLog[today].reviewCount += 1;

  saveProgress();
  updateTopbar();

  practiceState.correct += correct ? 1 : 0;
  practiceState.wrong += correct ? 0 : 1;
  renderPractice();
}
function practiceUndoCorrect(){
  // Kullanıcı "Doğru" işaretlenen bir cevabı geri alıp "aslında bilmiyordum"
  // diyor. Sadece az önce BU cevap için (başka bir karta geçilmeden) çağrılabilir.
  if(!practiceState.canUndo || practiceState.undoneId === null) return;
  const currentId = practiceState.undoneId;
  const originalRec = practiceState.preAnswerRec || {};

  // Az önceki "doğru" güncellemesini saymadan, orijinal rec üzerinden
  // doğrudan "yanlış" olarak yeniden zamanla.
  const updatedSchedule = scheduleNext(originalRec, false);
  progress.learned[currentId] = Object.assign({}, originalRec, updatedSchedule, {
    correctStreak: 0,
    timesWrong: (originalRec.timesWrong||0)+1
  });

  const m = progress.mistakes[currentId] || { count:0 };
  progress.mistakes[currentId] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: practiceState.answer + " (sonradan 'bilmiyordum' olarak düzeltildi)" };

  // Oturum sayaçlarını da düzelt: bu cevap artık doğru değil, yanlış sayılıyor.
  practiceState.correct = Math.max(0, practiceState.correct - 1);
  practiceState.wrong += 1;
  practiceState.feedback = "undone";
  practiceState.canUndo = false;

  saveProgress();
  updateTopbar();
  renderPractice();
}
function practiceReveal(){
  practiceState.feedback = "revealed";
  const currentId = practiceState.queue[0];
  const sentence = findSentence(currentId);
  const rec = progress.learned[currentId] || {};
  const updatedSchedule = scheduleNext(rec, false);
  progress.learned[currentId] = Object.assign({}, rec, updatedSchedule, { timesWrong: (rec.timesWrong||0)+1 });
  const m = progress.mistakes[currentId] || { count:0 };
  progress.mistakes[currentId] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: "(bilmiyorum dedi)" };
  practiceState.wrong += 1;
  saveProgress();
  updateTopbar();
  renderPractice();
}
function practiceNextItem(){
  clearTimeout(pendingAutoSpeakTimer); // önceki cümlenin feedback sesi kalmışsa iptal
  practiceState.answer = "";
  practiceState.feedback = null;
  // Bir sonraki karta geçince "Aslında Bilmiyordum" artık bu karta ait
  // olmadığı için geri alma imkanını da sıfırlıyoruz.
  practiceState.canUndo = false;
  practiceState.preAnswerRec = null;
  practiceState.undoneId = null;
  practiceState.queue.shift();
  renderPractice();
}

/* ============================================================
   ZAYIF NOKTALAR
   ============================================================ */
function renderMistakes(){
  const el = document.getElementById("view-mistakes");
  const entries = Object.keys(progress.mistakes).map(id => {
    const data = progress.mistakes[id];
    return Object.assign({ id:Number(id) }, data, { sentence: findSentence(Number(id)) });
  }).sort((a,b) => b.count - a.count);

  if(entries.length === 0){
    el.innerHTML = `
      <div class="panel">
        <h2 class="panel-title">Zayıf Nokta Yok</h2>
        <p class="panel-text">Henüz hiç hata kaydı yok — ya çok yeni başladın ya da harika gidiyorsun!</p>
        <button class="btn-primary" onclick="setView('home')">Ana Sayfaya Dön</button>
      </div>`;
    return;
  }

  let listHtml = "";
  entries.forEach(e => {
    const yourAnswerHtml = e.yourAnswer ? `<div class="mistake-your">Son cevabın: "${escapeHtml(e.yourAnswer)}"</div>` : "";
    listHtml += `
      <div class="mistake-card">
        <div class="mistake-count">${e.count}×</div>
        <div class="mistake-body">
          <div class="mistake-en">${escapeHtml(e.sentence ? e.sentence.en : "")}</div>
          <div class="mistake-tr">${escapeHtml(e.sentence ? e.sentence.tr : "")}</div>
          ${yourAnswerHtml}
        </div>
      </div>`;
  });

  el.innerHTML = `
    <div class="panel">
      <h2 class="panel-title">Zayıf Noktalar Defteri</h2>
      <p class="panel-text">En çok hata yapılan cümleler üstte. Bir cümleyi burada doğru cevaplarsan listeden tamamen çıkar.</p>
      <button class="btn-primary" style="margin-bottom:18px" onclick="startMistakesReview()">Zayıf Noktaları Çalış (${entries.length})</button>
      <div class="mistake-list">${listHtml}</div>
    </div>`;
}

/* ============================================================
   İSTATİSTİKLER / KARNE
   ============================================================ */
function renderStats(){
  const el = document.getElementById("view-stats");
  const learnedCount = Object.keys(progress.learned).length;
  let totalMistakes = 0;
  Object.values(progress.mistakes).forEach(m => totalMistakes += m.count);
  const logDays = Object.keys(progress.dailyLog).sort();
  let totalReviews = 0;
  Object.values(progress.dailyLog).forEach(d => totalReviews += (d.reviewCount||0));

  let stageRows = "";
  STAGES.forEach((s,i) => {
    const inStage = Object.keys(progress.learned).filter(id => id>=s.from && id<=s.to).length;
    const total = s.to - s.from + 1;
    stageRows += `
      <div class="stage-detail-row">
        <div class="stage-detail-name">${i+1}. ${escapeHtml(s.name)}</div>
        <div class="stage-detail-bar-track"><div class="stage-detail-bar-fill" style="width:${(inStage/total)*100}%"></div></div>
        <div class="stage-detail-count">${inStage}/${total}</div>
      </div>`;
  });

  el.innerHTML = `
    <div class="panel">
      <h2 class="panel-title">İlerleme Karnesi</h2>
      <div class="card-grid">
        <button class="stat-card" style="border-top-color:#8B2E2E" onclick="setView('browse')">
          <div class="stat-card-value" style="color:#8B2E2E">${learnedCount}</div>
          <div class="stat-card-title">Öğrenilen Cümle</div>
          <div class="stat-card-sub">/ 600</div>
        </button>
        <button class="stat-card" style="border-top-color:#2B4C6F" onclick="setView('practice')">
          <div class="stat-card-value" style="color:#2B4C6F">${totalReviews}</div>
          <div class="stat-card-title">Toplam Tekrar</div>
          <div class="stat-card-sub">pratik oturumu</div>
        </button>
        <button class="stat-card" style="border-top-color:#B08D3E" onclick="setView('mistakes')">
          <div class="stat-card-value" style="color:#B08D3E">${totalMistakes}</div>
          <div class="stat-card-title">Toplam Hata</div>
          <div class="stat-card-sub">işaretlendi</div>
        </button>
        <button class="stat-card" style="border-top-color:#5B7553" onclick="setView('home')">
          <div class="stat-card-value" style="color:#5B7553">${logDays.length}</div>
          <div class="stat-card-title">Ders Günü</div>
          <div class="stat-card-sub">gün çalışıldı</div>
        </button>
      </div>
      <h3 class="subheading">Aşama Bazlı İlerleme</h3>
      <div class="stage-detail-list">${stageRows}</div>
      <button class="btn-secondary" onclick="setView('home')">Ana Sayfaya Dön</button>
    </div>`;
}

/* ============================================================
   TÜM CÜMLELERE GÖZ AT
   ============================================================ */
function renderBrowse(){
  const el = document.getElementById("view-browse");

  // innerHTML yeniden yazılınca input focus/imleç konumunu kaybedebilir
  // (arama kutusuna yazarken özellikle rahatsız edici). Render öncesi
  // mevcut odak ve imleç konumunu not edip render sonrası geri veriyoruz.
  const prevInput = document.getElementById("browse-search-input");
  const hadFocus = prevInput && document.activeElement === prevInput;
  const prevSelStart = hadFocus ? prevInput.selectionStart : null;
  const prevSelEnd = hadFocus ? prevInput.selectionEnd : null;

  const stage = STAGES[browseState.stageFilter];
  let list = SENTENCES.filter(s => s.id >= stage.from && s.id <= stage.to);
  if(browseState.query.trim()){
    const q = browseState.query.toLowerCase();
    list = list.filter(s => s.en.toLowerCase().includes(q) || s.tr.toLowerCase().includes(q));
  }

  let tabsHtml = "";
  STAGES.forEach((s,i) => {
    tabsHtml += `<button class="stage-tab ${i===browseState.stageFilter?'active':''}" onclick="browseSetStage(${i})">${i+1}</button>`;
  });

  let rowsHtml = "";
  list.forEach(s => {
    const isLearned = !!progress.learned[s.id];
    rowsHtml += `
      <div class="browse-row">
        <div class="browse-id">${s.id}</div>
        <div class="browse-body">
          <div class="browse-en-row">
            <button class="speak-btn speak-btn-sm" onclick="speakBtn(${jsStr(s.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
            <div class="browse-en">${escapeHtml(s.en)}</div>
          </div>
          <div class="browse-tr">${escapeHtml(s.tr)}</div>
        </div>
        ${isLearned ? '<div class="browse-check">✓</div>' : ''}
      </div>`;
  });
  if(list.length === 0) rowsHtml = `<p class="panel-text">Bu aramaya uygun cümle bulunamadı.</p>`;

  el.innerHTML = `
    <div class="panel">
      <h2 class="panel-title">Tüm Cümleler</h2>
      <input type="text" class="text-input" id="browse-search-input" placeholder="Cümle ara (İngilizce ya da Türkçe)…"
        value="${escapeHtml(browseState.query)}" oninput="browseSetQuery(this.value)">
      <div class="stage-tabs">${tabsHtml}</div>
      <div class="browse-list">${rowsHtml}</div>
      <button class="btn-secondary" onclick="setView('home')">Ana Sayfaya Dön</button>
    </div>`;

  if(hadFocus){
    const newInput = document.getElementById("browse-search-input");
    if(newInput){
      newInput.focus();
      // imleç konumunu da geri koy, yoksa yazarken imleç hep sona atlar
      if(prevSelStart !== null) newInput.setSelectionRange(prevSelStart, prevSelEnd);
    }
  }
}
function setDailyNewCount(v){
  const n = Number(v);
  if(!progress.settings) progress.settings = {};
  progress.settings.dailyNewCount = n;
  saveProgress();
  // Not: bu ayar bir sonraki "Bugünkü Dersi Başlat" tıklamasında devreye girer
  // (initLesson her çağrıldığında güncel değeri okur); devam eden bir dersi etkilemez.
}

let browseQueryTimer = null; // arama debounce'u için; sekme değişince de sıfırlanır
function browseSetStage(i){
  browseState.stageFilter = i;
  clearTimeout(browseQueryTimer); // bekleyen arama render'ı varsa iptal, çakışma olmasın
  renderBrowse();
}
function browseSetQuery(v){
  browseState.query = v;
  // Her tuşta tüm listeyi yeniden filtrelemek/çizmek yerine kısa bir
  // bekleme sonrası render ediyoruz; yazarken akıcılık artıyor.
  clearTimeout(browseQueryTimer);
  browseQueryTimer = setTimeout(renderBrowse, 150);
}
