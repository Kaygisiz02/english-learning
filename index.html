<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anne ile İngilizce Öğreniyorum — 800 Cümle</title>
<style>
:root{
  --paper:#FFFFFF;
  --paper-line:#F5F5F5;
  --ink-navy:#1F3350;
  --ink-red:#8B2E2E;
  --duo-green:#58CC02;
  --duo-green-deep:#58A700;
  --duo-green-pale:#D7FFB8;
  --streak-orange:#FF9600;
  --streak-orange-deep:#CC7700;
  --line:#D8CCAF;
  --text:#2A2620;
  --muted:#7A7264;
  --good:#5B7553;
  --good-bg:#EFF3EA;
  --good-border:#B7CBA8;
  --bad-bg:#F7EBEA;
  --bad-border:#DDB6B0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  background-image:repeating-linear-gradient(var(--paper), var(--paper) 34px, var(--paper-line) 35px);
  font-family:Georgia,'Times New Roman',serif;
  color:var(--text);
  padding-bottom:60px;
}
.hidden{display:none !important;}

/* ---- top bar ---- */
#topbar{
  position:sticky; top:0; z-index:10;
  background:var(--paper);
  border-bottom:3px double var(--ink-navy);
  box-shadow:0 2px 6px rgba(31,51,80,0.08);
}
#topbar-inner{
  max-width:760px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
#brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
#brand-mark{
  font-weight:700; font-size:20px; color:#fff; background:var(--duo-green-deep);
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; letter-spacing:-1px;
}
#brand-title{font-size:15px; font-weight:700; color:var(--ink-navy); line-height:1.2;}
#brand-sub{font-size:12px; color:var(--muted); margin-top:2px;}
#progress-track{flex:1; min-width:100px; height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
#progress-fill{height:100%; background:linear-gradient(90deg,var(--duo-green-deep),var(--duo-green)); transition:width .5s ease; width:0%;}
.nav-btn{
  background:transparent; border:1px solid var(--line); border-radius:4px;
  padding:7px 12px; font-size:12.5px; font-family:Georgia,serif; color:var(--text);
  cursor:pointer;
}
.nav-btn:hover{background:#fff;}

#streak-badge{
  display:none; align-items:center; gap:5px; background:#FFF4E0;
  border:1.5px solid var(--streak-orange); border-radius:20px; padding:5px 12px;
  font-weight:700; font-size:14px; color:var(--streak-orange-deep); flex-shrink:0;
  font-family:Georgia,serif; cursor:default;
}
#streak-badge.show{display:flex;}
#streak-badge.at-risk{animation:streak-pulse 1.4s ease-in-out infinite;}
@keyframes streak-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,150,0,0.35);}
  50%{box-shadow:0 0 0 6px rgba(255,150,0,0);}
}

#container{max-width:760px; margin:0 auto; padding:24px 20px;}

/* ---- generic panel/card ---- */
.panel{
  background:#fff; border:1px solid var(--line); border-radius:4px;
  padding:28px 24px; box-shadow:2px 3px 0 rgba(31,51,80,0.06);
}
.panel-title{font-size:21px; font-weight:700; color:var(--ink-navy); margin:0 0 8px 0;}
.panel-text{font-size:14px; color:var(--text); line-height:1.6; margin-bottom:16px;}
.subheading{font-size:15px; font-weight:700; color:var(--ink-navy); margin:24px 0 10px 0;}

/* ---- home ---- */
.hero{
  background:#fff;
  border:1px solid var(--line); border-radius:4px; padding:22px 24px;
  margin-bottom:16px; box-shadow:2px 3px 0 rgba(31,51,80,0.06);
}
.hero-eyebrow{font-size:11px; letter-spacing:1.5px; color:var(--duo-green-deep); font-weight:700; margin-bottom:6px; text-transform:uppercase;}
.hero-title{font-size:22px; font-weight:700; color:var(--ink-navy); margin:0 0 6px 0;}
.hero-desc{font-size:14px; color:var(--text); line-height:1.5; margin-bottom:12px;}
.hero-buttons{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.daily-count-row{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:var(--muted);}
.daily-count-select{
  font-family:Georgia,serif; font-size:12.5px; color:var(--text);
  border:1px solid var(--line); border-radius:4px; padding:4px 8px; background:#fff; cursor:pointer;
}
.daily-count-warning{
  font-size:11.5px; color:var(--ink-red); margin-top:6px; line-height:1.5;
  font-style:italic; max-width:420px;
}

/* Ana sayfa hero'sundaki kompakt tek-satır ilerleme çubuğu. Eskiden burada
   140x140 bir SVG halka grafiği vardı; topbar'da zaten aynı bilgi (X/800 · %Y)
   sabit şekilde göründüğü için mobilde dikey yer kaplayan bu tekrarı kaldırıp
   yerine tek satırlık bir çubuk konuldu. */
.hero-progress-row{display:flex; align-items:center; gap:10px;}
.hero-progress-track{flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
.hero-progress-fill{height:100%; background:linear-gradient(90deg,var(--duo-green-deep),var(--duo-green)); transition:width .5s ease;}
.hero-progress-label{font-size:12px; font-weight:700; color:var(--ink-navy); white-space:nowrap; font-family:Georgia,serif;}

.daily-goal-pill{
  display:inline-block; margin-top:8px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px;
  background:#F0F0F0; color:var(--muted); white-space:nowrap;
}
.daily-goal-pill.done{background:var(--duo-green-pale); color:var(--duo-green-deep);}

/* ---- kutlama / confetti ---- */
#confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;}
.confetti-piece{
  position:absolute; top:0; width:8px; height:14px; opacity:0.95; border-radius:2px;
  animation-name:confetti-fall; animation-timing-function:ease-in; animation-fill-mode:forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg); opacity:1;}
  100%{transform:translateY(260px) rotate(560deg); opacity:0;}
}
.praise-pop{
  display:inline-block; animation:praise-pop-anim .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes praise-pop-anim{
  0%{transform:scale(0.6); opacity:0;}
  60%{transform:scale(1.12);}
  100%{transform:scale(1); opacity:1;}
}
.stage-complete-banner{
  background:var(--duo-green-pale); color:var(--duo-green-deep); font-weight:700; font-size:13px;
  padding:8px 12px; border-radius:8px; margin-bottom:12px; text-align:center;
}

.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
.stat-card{
  background:#fff; border:1px solid var(--line); border-top:4px solid; border-radius:4px;
  padding:16px 14px; text-align:left; cursor:pointer; font-family:Georgia,serif;
}
.stat-card-value{font-size:26px; font-weight:700; line-height:1;}
.stat-card-title{font-size:13px; font-weight:700; color:var(--text); margin-top:8px;}
.stat-card-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

/* Ana sayfadaki 4'lü istatistik kartının kompakt hâli: alt açıklama (stat-card-sub)
   satırı kaldırılıp iç boşluk daraltılarak dikey yer kazanılıyor — mobilde
   Ders Yolu'na ulaşmak için gereken kaydırma miktarını azaltmak için. */
.card-grid-compact{gap:8px; margin-bottom:18px;}
.card-grid-compact .stat-card{padding:12px 10px;}
.card-grid-compact .stat-card-value{font-size:21px;}
.card-grid-compact .stat-card-title{font-size:11.5px; margin-top:4px;}

/* Ana sayfadaki "Bugün Bunları Göreceksin" önizlemesi artık bir <details>
   içinde: varsayılan kapalı durur, dokunulunca açılır. Panel içeriğini
   sürekli açık tutmak yerine isteğe bağlı hale getirerek sayfa açılışında
   daha az kaydırma gerektirir. */
.preview-details .preview-list{margin-top:10px;}
.preview-summary{cursor:pointer; list-style:none;}
.preview-summary::-webkit-details-marker{display:none;}
.preview-summary::after{content:" ▾"; color:var(--muted); font-size:12px;}
details[open] .preview-summary::after{content:" ▴";}

.stage-row{display:flex; flex-direction:column; gap:8px;}
.build-version-tag{margin-top:18px; font-size:10.5px; color:var(--line); text-align:center;}

/* ---- görsel ders yolu (path) ---- */
.lesson-path{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px; position:relative;}
.lesson-path::before{
  content:""; position:absolute; top:29px; bottom:29px; left:50%; width:3px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
  transform:translateX(-50%); z-index:0;
}
.path-row{display:flex; width:100%; max-width:300px; margin-bottom:14px; position:relative; z-index:1;}
.path-row.side-left{justify-content:flex-start;}
.path-row.side-right{justify-content:flex-end;}
.path-node{display:flex; flex-direction:column; align-items:center; gap:6px; width:130px; background:none; border:none; padding:0; font-family:Georgia,serif;}
.path-node-circle{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:700; flex-shrink:0; border:3px solid;
  background:#fff; color:var(--muted); border-color:var(--line); box-shadow:0 3px 0 var(--line);
  transition:transform .08s ease;
}
.path-node.is-complete .path-node-circle{
  background:var(--duo-green); border-color:var(--duo-green-deep); color:#fff; box-shadow:0 4px 0 var(--duo-green-deep);
}
.path-node.is-current .path-node-circle{
  background:#fff; border-color:var(--duo-green); color:var(--duo-green-deep); box-shadow:0 4px 0 var(--duo-green);
  animation:path-current-pulse 1.8s ease-in-out infinite;
}
@keyframes path-current-pulse{
  0%,100%{box-shadow:0 4px 0 var(--duo-green), 0 0 0 0 rgba(88,204,2,0.35);}
  50%{box-shadow:0 4px 0 var(--duo-green), 0 0 0 8px rgba(88,204,2,0);}
}
.path-node.is-complete, .path-node.is-current{cursor:pointer;}
.path-node.is-complete:active .path-node-circle, .path-node.is-current:active .path-node-circle{
  transform:translateY(3px); box-shadow:0 1px 0 var(--duo-green-deep);
}
.path-node-label{font-size:12px; font-weight:700; color:var(--text); text-align:center; line-height:1.25;}
.path-node-sub{font-size:10.5px; color:var(--muted); text-align:center;}

/* ---- lesson / card ---- */
.lesson-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
.lesson-breadcrumb{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
.lesson-counter{font-size:13px; font-weight:700; color:var(--duo-green-deep);}
.lesson-exit-row{margin-bottom:8px;}
.lesson-exit-link{
  background:none; border:none; padding:0; font-family:Georgia,serif; font-size:12.5px;
  color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}
.lesson-exit-link:hover{color:var(--ink-navy);}

.teach-card{border:1px solid var(--line); border-radius:4px; padding:22px 20px; background:#FEFCF6;}
.card-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; display:block; margin-bottom:4px;}
.card-en{font-size:24px; font-weight:700; color:var(--ink-navy); line-height:1.3;}

/* ---- speak button (seslendirme) ---- */
.speak-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  background:#fff; border:1.5px solid var(--ink-navy); color:var(--ink-navy);
  font-size:15px; cursor:pointer; flex-shrink:0; vertical-align:middle;
  transition:background .15s ease, transform .1s ease;
}
.speak-btn:hover{background:#EDE4D0;}
.speak-btn:active{transform:scale(0.92);}
.speak-btn.speaking{background:var(--duo-green); border-color:var(--duo-green); color:#fff; animation:pulse 0.6s ease-in-out infinite alternate;}
@keyframes pulse{ from{opacity:1;} to{opacity:.6;} }
.speak-btn-sm{width:26px; height:26px; font-size:12px;}
.card-en-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pattern-row-with-speak{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.pattern-en-wrap{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}

.answer-input-row{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.answer-input-row .text-input{flex:1; margin-bottom:0;}
.mic-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  background:#fff; border:1.5px solid var(--ink-navy); color:var(--ink-navy);
  font-size:18px; cursor:pointer; transition:background .15s ease, transform .1s ease;
}
.mic-btn:hover{background:#EDE4D0;}
.mic-btn:active{transform:scale(0.92);}
.mic-btn.mic-listening{background:var(--duo-green); border-color:var(--duo-green); color:#fff; animation:pulse 0.6s ease-in-out infinite alternate;}
.mic-error-text{font-size:12px; color:var(--ink-red); margin:-4px 0 12px 0; line-height:1.5;}
.browse-en-row{display:flex; align-items:center; gap:8px;}
.feedback-answer-row{display:flex; align-items:center; gap:10px;}
.card-divider{height:1px; background:var(--line); margin:14px 0;}
.card-field{margin-bottom:14px;}
.card-tr{font-size:17px; color:var(--text); font-weight:600;}
.card-pron{font-size:15px; color:var(--duo-green-deep); font-style:italic;}
.word-list{display:flex; flex-direction:column; gap:4px;}
.word-item{display:flex; gap:6px; font-size:13.5px;}
.word-en{font-weight:700; color:var(--ink-navy); min-width:70px;}
.word-dash{color:var(--muted);}
.word-no-meaning{color:var(--muted); font-style:italic; font-size:12px;}
.card-usage{font-size:13.5px; color:var(--text); line-height:1.6; font-style:italic;}

.pattern-box{background:var(--paper); border-radius:4px; padding:14px 16px; margin:4px 0 18px 0; border:1px dashed var(--line);}
.pattern-title{font-size:11.5px; font-weight:700; color:var(--duo-green-deep); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
.pattern-row{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--line);}
.pattern-row:last-child{border-bottom:none;}
.pattern-en{font-weight:600; color:var(--text);}
.pattern-tr{color:var(--muted); flex-shrink:0;}

/* ---- Recognize fazı: çoktan seçmeli tanıma ---- */
.choice-list{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
.choice-btn{
  text-align:left; font-family:Georgia,serif; font-size:14.5px; color:var(--text);
  background:#fff; border:2px solid var(--line); border-radius:4px; padding:12px 14px;
  cursor:pointer; transition:border-color .12s ease, background .12s ease;
}
.choice-btn:hover:not(:disabled){border-color:var(--ink-navy); background:#FBF8F0;}
.choice-btn:disabled{cursor:default;}
.choice-correct{border-color:var(--good) !important; background:var(--good-bg) !important; font-weight:700;}
.choice-wrong{border-color:var(--ink-red) !important; background:var(--bad-bg) !important;}

/* ---- Build fazı: kelime dizme (tap the tiles) ---- */
.build-answer-row{
  min-height:52px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:12px 14px; margin-bottom:16px; background:#F8F4E9;
  border:2px dashed var(--line); border-radius:4px;
}
.build-placeholder{font-size:13px; color:var(--muted); font-style:italic;}
.build-bank{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.tile-btn{
  font-family:Georgia,serif; font-size:14.5px; font-weight:600; color:var(--ink-navy);
  background:#fff; border:2px solid var(--ink-navy); border-radius:4px; padding:8px 14px;
  cursor:pointer; transition:transform .1s ease;
}
.tile-btn:hover:not(:disabled){background:#EDE4D0;}
.tile-btn:active:not(:disabled){transform:scale(0.95);}
.tile-btn:disabled{opacity:.6; cursor:default;}
.tile-used{background:var(--ink-navy); color:#fff;}

.recall-hint{font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.5;}
.text-input{
  width:100%; font-size:16px; padding:12px 14px; border:2px solid var(--line);
  border-radius:4px; font-family:Georgia,serif; background:#fff; margin-bottom:12px; color:var(--text);
}
.text-input:focus{outline:none; border-color:var(--ink-navy);}

.feedback-box{border-radius:4px; padding:16px; margin-top:10px;}
.feedback-good{background:var(--good-bg); border:1px solid var(--good-border);}
.feedback-bad{background:var(--bad-bg); border:1px solid var(--bad-border);}
.feedback-answer{font-size:19px; font-weight:700; color:var(--ink-navy); margin-bottom:4px;}
.feedback-label{font-size:13px; color:var(--text); margin-bottom:12px;}
.undo-correct-link{
  display:block; background:none; border:none; padding:0; margin:-4px 0 12px 0;
  font-family:Georgia,serif; font-size:12px; color:var(--muted); cursor:pointer;
  text-decoration:underline; text-underline-offset:2px;
}
.undo-correct-link:hover{color:var(--ink-red);}

.done-stamp{font-size:40px; color:var(--good); text-align:center; margin-bottom:6px;}
.done-list{display:flex; flex-direction:column; gap:8px; margin:18px 0; max-height:300px; overflow-y:auto;}
.done-item{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:8px 10px; background:#F8F4E9; border-radius:4px;}
.done-item-en{font-weight:700; color:var(--ink-navy);}
.done-item-tr{color:var(--muted);}

/* ---- mistakes ---- */
.mistake-list{display:flex; flex-direction:column; gap:10px;}
.mistake-card{display:flex; gap:14px; align-items:flex-start; border:1px solid var(--line); border-radius:4px; padding:14px 16px; background:#FEFCF6;}
.mistake-count{font-size:18px; font-weight:700; color:var(--ink-red); min-width:34px;}
.mistake-body{flex:1;}
.mistake-en{font-size:15.5px; font-weight:700; color:var(--ink-navy);}
.mistake-tr{font-size:13.5px; color:var(--muted); margin-top:2px;}
.mistake-your{font-size:12px; color:var(--ink-red); margin-top:6px; font-style:italic;}

/* ---- stats ---- */
.stage-detail-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
.stage-detail-row{display:flex; align-items:center; gap:12px;}
.stage-detail-name{flex:0 0 190px; font-size:13px; font-weight:600; color:var(--text);}
.stage-detail-bar-track{flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
.stage-detail-bar-fill{height:100%; background:var(--ink-navy);}
.stage-detail-count{font-size:12px; color:var(--muted); min-width:44px; text-align:right;}

/* ---- browse ---- */
.stage-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.stage-tab{
  width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:700; color:var(--text); cursor:pointer; font-family:Georgia,serif;
}
.stage-tab.active{background:var(--ink-navy); color:#fff; border-color:var(--ink-navy);}
.browse-list{display:flex; flex-direction:column; gap:6px; max-height:480px; overflow-y:auto; margin-bottom:18px;}
.browse-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line);}
.browse-id{font-size:11px; color:var(--muted); min-width:28px; font-weight:700;}
.browse-body{flex:1;}
.browse-en{font-size:14px; font-weight:600; color:var(--text);}
.browse-tr{font-size:12px; color:var(--muted);}
.browse-check{color:var(--good); font-weight:700; font-size:15px;}

/* ---- buttons ---- */
.btn-primary{
  background:var(--duo-green); color:#fff; border:none; border-radius:12px; padding:12px 22px;
  font-size:14.5px; font-weight:700; cursor:pointer; font-family:Georgia,serif;
  box-shadow:0 4px 0 var(--duo-green-deep); transition:transform .05s ease, box-shadow .05s ease;
}
.btn-primary:active{transform:translateY(3px); box-shadow:0 1px 0 var(--duo-green-deep);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed;}
.btn-secondary{
  background:#fff; color:var(--ink-navy); border:2px solid var(--ink-navy); border-radius:12px;
  padding:10px 20px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:Georgia,serif;
}
.btn-ghost{
  background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:12px;
  padding:10px 20px; font-size:13.5px; cursor:pointer; font-family:Georgia,serif;
}

/* ---- loading ---- */
#loading-screen{min-height:100vh; display:flex; align-items:center; justify-content:center;}
#loading-pen{font-size:40px; margin-bottom:8px; color:var(--duo-green); text-align:center;}
#loading-text{font-size:15px; color:var(--muted); text-align:center;}

@media (max-width:480px){
  .path-row{max-width:260px;}
  .path-node{width:112px;}
  .path-node-circle{width:50px; height:50px; font-size:17px;}
}

/* ---- motivasyon şeridi (Duolingo tarzı maskot mesajı) ---- */
.mascot-strip{
  display:flex; align-items:center; gap:12px; background:#FFF8E8;
  border:1px solid var(--line); border-left:4px solid var(--streak-orange);
  border-radius:4px; padding:12px 16px; margin-bottom:18px;
  box-shadow:2px 3px 0 rgba(31,51,80,0.05);
}
.mascot-emoji{font-size:26px; flex-shrink:0; line-height:1;}
.mascot-text{font-size:13.5px; color:var(--text); line-height:1.45;}
.mascot-text strong{color:var(--ink-navy);}

/* ---- haftalık seri takvimi ---- */
.week-strip{
  display:flex; justify-content:space-between; gap:6px; margin:14px 0 4px 0;
}
.week-day{
  display:flex; flex-direction:column; align-items:center; gap:5px; flex:1;
}
.week-day-label{font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase;}
.week-day-dot{
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--line); background:#fff; font-size:13px; color:var(--muted); flex-shrink:0;
}
.week-day-dot.is-active{background:var(--duo-green); border-color:var(--duo-green-deep); color:#fff;}
.week-day-dot.is-today{border-color:var(--streak-orange); border-width:2.5px;}
.week-day-dot.is-today.is-active{background:var(--streak-orange); border-color:var(--streak-orange-deep);}

/* ---- sıradaki cümleler önizlemesi ---- */
.preview-list{display:flex; flex-direction:column; gap:0; margin-top:2px;}
.preview-row{
  display:flex; align-items:baseline; gap:10px; padding:9px 2px;
  border-bottom:1px solid var(--paper-line);
}
.preview-row:last-child{border-bottom:none;}
.preview-num{font-size:11px; color:var(--muted); font-weight:700; min-width:20px;}
.preview-en{font-size:13.5px; font-weight:600; color:var(--ink-navy); flex-shrink:0;}
.preview-tr{font-size:12px; color:var(--muted);}
.preview-more{font-size:12px; color:var(--muted); font-style:italic; padding:8px 2px 0 2px;}

/* ---- bölüm başlığı satırı ---- */
.section-head-row{display:flex; align-items:baseline; justify-content:space-between; margin:24px 0 10px 0;}
.section-head-row .subheading{margin:0;}
</style>

our plans for the weekend?","tr":"Hafta sonu için planların ne?","pron":"Vat ar yor plenz for dı vikend?","words":[["plans","planlar"],["weekend","hafta sonu"]],"usage":"Plan sorma kalıbı."},{"id":297,"en":"I don't have any plans.","tr":"Hiç planım yok.","pron":"Ay dont hev eni plenz.","words":[["any","hiç"]],"usage":"Plansızlık belirtme."},{"id":298,"en":"I'm planning to visit my family.","tr":"Ailemi ziyaret etmeyi planlıyorum.","pron":"Aym plening tu vizit may femili.","words":[["planning to","planlıyor"]],"usage":"Plan belirtme kalıbı."},{"id":299,"en":"Maybe next time.","tr":"Belki bir dahaki sefere.","pron":"Meybi nekst taym.","words":[["next time","bir dahaki sefer"]],"usage":"Geleceğe erteleme."},{"id":300,"en":"We'll see.","tr":"Göreceğiz / Bakarız.","pron":"Vil si.","words":[["We'll","-eceğiz (we will)"]],"usage":"Kararsızlık, sonucu belirsiz bırakma."},{"id":301,"en":"I've never been to Paris.","tr":"Hiç Paris'e gitmedim.","pron":"Ayv nevır bin tu Peris.","words":[["I've","-dim (I have)"],["never been","hiç gitmemiş"]],"usage":"Present perfect: hayat boyu deneyim belirtme."},{"id":302,"en":"I've already eaten.","tr":"Zaten yemek yedim.","pron":"Ayv olredi itın.","words":[["already","zaten, çoktan"],["eaten","yenmiş"]],"usage":"Present perfect: yakın zamanda tamamlanmış eylem."},{"id":303,"en":"I haven't finished yet.","tr":"Henüz bitirmedim.","pron":"Ay hevınt finişt yet.","words":[["haven't","-medi (have not)"],["yet","henüz"]],"usage":"Present perfect olumsuz: tamamlanmamış eylem."},{"id":304,"en":"Have you ever tried sushi?","tr":"Hiç suşi denedin mi?","pron":"Hev yu evır trayd suşi?","words":[["ever","hiç"],["tried","denedi"]],"usage":"Present perfect soru: deneyim sorma."},{"id":305,"en":"I've lived here for five years.","tr":"Beş yıldır burada yaşıyorum.","pron":"Ayv livd hiır for fayv yırz.","words":[["for","süresince"],["five years","beş yıl"]],"usage":"Present perfect: geçmişten şimdiye süren durum."},{"id":306,"en":"I've known him since 2019."," // Not: Date.toISOString() her zaman UTC kullanır. Kullanıcının yerel takvim
// gününü (örn. Türkiye'de UTC+3) doğru yansıtmak için yerel yıl/ay/gün
// bileşenlerinden manuel olarak YYYY-MM-DD üretiyoruz. UTC tabanlı bir
// karşılaştırma kullanılsaydı, yerel saatle gece yarısına yakın (UTC'de
// hâlâ "dün" olan) bir kullanım, kaydı yanlış güne düşürebilir ve bu da
// örneğin haftalık ilerleme şeridinde günlerin kaymış/ters görünmesine yol açardı.
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function addDaysStr(dateStr, delta){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + delta);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
// Günlük seri (streak): dailyLog'daki (herhangi bir aktivitesi olan) günleri
// bugünden geriye doğru ardışık say. Bugün henüz çalışılmadıysa ama dün
// çalışıldıysa seri "risk altında" sayılır (gece yarısına kadar hâlâ
// kurtarılabilir) — Duolingo'nun streak mantığıyla aynı.
function computeStreak(){
  const activeDays = new Set(
    Object.keys(progress.dailyLog).filter(d => {
      const log = progress.dailyLog[d];
      return ((log.newCount||0) + (log.reviewCount||0)) > 0;
    })
  );
  if(activeDays.size === 0) return { count:0, activeToday:false, atRisk:false };
  const today = todayStr();
  const yesterday = addDaysStr(today, -1);
  let anchor;
  if(activeDays.has(today)) anchor = today;
  else if(activeDays.has(yesterday)) anchor = yesterday;
  else return { count:0, activeToday:false, atRisk:false };
  let count = 0;
  let cursor = anchor;
  while(activeDays.has(cursor)){
    count++;
    cursor = addDaysStr(cursor, -1);
  }
  return { count, activeToday: activeDays.has(today), atRisk: !activeDays.has(today) };
}
// Günlük hedef: "Günlük yeni cümle sayısı" ayarını gerçek bir hedefe bağlıyoruz.
// Destede yeni cümle kalmadıysa (800'ü bitirdiyse) hedef yerine bugün herhangi
// bir tekrar yapılıp yapılmadığına bakıyoruz.
function getDailyGoalStatus(){
  const today = todayStr();
  const log = progress.dailyLog[today] || { newCount:0, reviewCount:0 };
  const configured = (progress.settings && progress.settings.dailyNewCount) || 8;
  const remainingNew = 800 - Object.keys(progress.learned).length;
  const target = Math.min(configured, Math.max(remainingNew, 0));
  if(target === 0){
    return { done: log.reviewCount > 0 || log.newCount > 0, newCount: log.newCount, target: 0, deckFinished: true };
  }
  return { done: log.newCount >= target, newCount: log.newCount, target, deckFinished: false };
}

// Son 7 günün (bugün dahil, en solda 6 gün önce) aktivite durumunu döndürür.
// Haftalık seri şeridi için kullanılır — Duolingo'nun hafta görünümüne benzer.
function getWeekActivity(){
  const today = todayStr();
  const dayLabels = ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
  const days = [];
  for(let i=6; i>=0; i--){
    const d = addDaysStr(today, -i);
    // Güvenlik: bu döngü zaten bugün ve öncesini üretir (delta hep <=0),
    // ama eski/bozuk dailyLog kayıtlarında bugünden ileri bir tarih olsa
    // bile (örn. önceki bir timezone hatasından kalan veri) o günü asla
    // "aktif" göstermiyoruz — gelecek bir gün yeşil işaretlenemez.
    const log = (d <= today) ? (progress.dailyLog[d] || { newCount:0, reviewCount:0 }) : { newCount:0, reviewCount:0 };
    const jsDay = new Date(d + "T00:00:00").getDay(); // 0=Pazar
    const labelIdx = (jsDay + 6) % 7; // Pazartesi=0 olacak şekilde kaydır
    days.push({
      date: d,
      label: dayLabels[labelIdx],
      active: ((log.newCount||0) + (log.reviewCount||0)) > 0,
      isToday: d === today
    });
  }
  return days;
}

// Ana sayfadaki maskot/motivasyon şeridi için duruma göre değişen kısa mesaj.
// Ana sayfadaki maskot/motivasyon şeridi için duruma göre değişen kısa mesaj.
// Duolingo'daki "bugün ne yapman gerektiğini söyleyen" küçük ipucu şeridinden ilham alındı.
// Not: hero başlığı zaten "şu an X. cümledesin" bilgisini veriyor, bu yüzden burada
// onunla çakışmayan, gerçekten ek bilgi taşıyan durumlar dışında mesaj döndürülmüyor (null).
function getMascotMessage(){
  const streak = computeStreak();
  const dueToday = getDueReviews().length;
  const goal = getDailyGoalStatus();
  const learnedCount = Object.keys(progress.learned).length;

  // Seri en az 2 gün üst üste sürüyorsa VE bugün henüz çalışılmadıysa gerçek
  // bir "risk" var — sadece dünkü tek günlük çalışmayı "seri" diye sunup
  // gereksiz alarm vermemek için eşiği 1'in üstünde tutuyoruz.
  if(streak.atRisk && streak.count > 1){
    return { emoji:"⚠️", html:`<strong>${streak.count} günlük serin</strong> risk altında — bugün çalışmazsan sıfırlanacak. Hemen küçük bir ders yapalım mı?` };
  }
  if(goal.deckFinished && !goal.done){
    return { emoji:"🏁", html:"800 cümlenin hepsini öğrendin! Şimdi tekrarlarla bilgini tazelemenin tam zamanı." };
  }
  if(dueToday >= 10){
    return { emoji:"⏰", html:`Bugün <strong>${dueToday} cümle</strong> tekrar bekliyor. Unutmadan önce bir göz atmaya ne dersin?` };
  }
  if(goal.done){
    return { emoji:"🎉", html:"Bugünkü hedefini tamamladın, harikasın! İstersen fazladan bir tur daha atabilirsin." };
  }
  if(streak.count >= 3){
    return { emoji:"🔥", html:`<strong>${streak.count} gündür</strong> kesintisiz çalışıyorsun. Bu ivmeyi bugün de sürdürelim!` };
  }
  // Seri tamamen sıfırlanmış (dün de çalışılmamış, artık "risk altında"
  // değil çünkü kurtarılacak bir şey kalmadı) ama daha önce en az bir şey
  // öğrenilmiş — bu, kullanıcıyı nazikçe geri çağırmamız gereken durum.
  if(learnedCount > 0 && streak.count === 0){
    return dueToday > 0
      ? { emoji:"👋", html:`Bir süredir uğramadın. <strong>${dueToday} cümle</strong> seni tekrar için bekliyor — küçük bir başlangıç yapalım mı?` }
      : { emoji:"👋", html:"Bir süredir uğramadın. Kaldığın yerden birkaç cümleyle devam etmeye ne dersin?" };
  }
  return null;
}

const CONFETTI_COLORS = ["#58CC02","#FF9600","#1CB0F6","#FFC800","#CE82FF","#8B2E2E"];
function fireConfetti(count){
  // Hareket azaltma tercihi olan kullanıcılar için dekoratif animasyonu atla.
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.getElementById("confetti-layer");
  if(!layer) return;
  count = count || 22;
  const w = window.innerWidth || 360;
  for(let i=0; i<count; i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const startX = w/2 + (Math.random()-0.5) * Math.min(220, w*0.6);
    el.style.left = startX + "px";
    el.style.top = (18 + Math.random()*10) + "%";
    el.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.animationDuration = (0.8 + Math.random()*0.6) + "s";
    layer.appendChild(el);
    // animationend + setTimeout birlikte: prefers-reduced-motion kapalıyken bile
    // bir tarayıcı animationend'i tetiklemezse (nadir ama olası) düğümler DOM'da
    // sonsuza dek birikmesin diye ikinci bir güvenlik ağı.
    el.addEventListener("animationend", () => el.remove());
    setTimeout(() => { if(el.parentNode) el.remove(); }, 1600);
  }
}

// Bir cümledeki TÜM kelimeleri (veri setinde elle açıklanmış olsun ya da
// olmasın) sırayla döndürür. Önce veri setindeki sentence.words dizisine
// bakar (orada varsa, en spesifik/bağlamsal açıklama odur, öncelik ondadır);
// orada yoksa WORD_DICTIONARY'ye bakar; o da yoksa kelimeyi sessizce atlamak
// yerine en azından kelimenin kendisini gösterir (boş bırakmaktansa daha
// faydalı - kullanıcı en azından hangi kelimenin orada olduğunu görür).
function getFullWordBreakdown(sentence){
  const enClean = sentence.en.replace(/[.!?,]/g, "");
  const tokens = enClean.split(/\s+/).filter(t => t.length > 0);
  const tokensLower = tokens.map(t => t.toLowerCase().replace(/^'|'$/g, ""));

  // Veri setindeki her öbeği (örn. "try on", "thank you") cümle içinde
  // bulmaya çalışıyoruz. Öbekler bitişik olabilir ("thank you" gibi) ya da
  // aralarına başka kelimeler girmiş olabilir ("try this on" cümlesindeki
  // "try on" öbeği gibi — phrasal verb'ler nesneyle ayrılabilir). Her iki
  // durumda da öbeğin kelimelerini CÜMLEDEKİ SIRAYLA arayıp buluyoruz.
  // usedIndex: bir token pozisyonunun hangi öbeğe ait olduğunu tutar,
  // böylece iki farklı öbek aynı kelimeyi paylaşmaya çalışırsa çakışmayı
  // önleriz (ilk bulunan öbek önceliklidir).
  const tokenToPhrase = new Array(tokens.length).fill(null); // { phraseIdx, isFirst, text, meaning }
  const usedIndex = new Array(tokens.length).fill(false);

  sentence.words.forEach((w, phraseIdx) => {
    const phraseWords = w[0].toLowerCase().split(/\s+/);
    if(phraseWords.length === 1){
      // Tek kelimelik "öbek": doğrudan eşleşen ilk boş pozisyonu bul.
      const idx = tokensLower.findIndex((t, i) => t === phraseWords[0] && !usedIndex[i]);
      if(idx !== -1){
        usedIndex[idx] = true;
        tokenToPhrase[idx] = { phraseIdx, isFirst: true, text: w[0], meaning: w[1], coveredIndices: [idx] };
      }
      return;
    }
    // Çok kelimelik öbek: ilk kelimenin her olası başlangıcından itibaren,
    // kalan kelimeleri sırayla (aralarında en fazla 3 kelime boşluk olacak
    // şekilde — makul bir phrasal verb mesafesi) arıyoruz.
    const MAX_GAP = 3;
    for(let start = 0; start < tokens.length; start++){
      if(usedIndex[start] || tokensLower[start] !== phraseWords[0]) continue;
      const coveredIndices = [start];
      let searchFrom = start + 1;
      let allFound = true;
      for(let pw = 1; pw < phraseWords.length; pw++){
        let found = -1;
        for(let j = searchFrom; j < Math.min(tokens.length, searchFrom + MAX_GAP + 1); j++){
          if(!usedIndex[j] && tokensLower[j] === phraseWords[pw]){ found = j; break; }
        }
        if(found === -1){ allFound = false; break; }
        coveredIndices.push(found);
        searchFrom = found + 1;
      }
      if(allFound){
        coveredIndices.forEach((idx, i) => {
          usedIndex[idx] = true;
          tokenToPhrase[idx] = { phraseIdx, isFirst: i === 0, text: w[0], meaning: w[1], coveredIndices };
        });
        break; // bu öbek için eşleşme bulundu, sonraki words öğesine geç
      }
    }
  });

  const result = [];
  for(let i = 0; i < tokens.length; i++){
    const phraseInfo = tokenToPhrase[i];
    if(phraseInfo){
      if(phraseInfo.isFirst){
        result.push([phraseInfo.text, phraseInfo.meaning]);
      }
      // isFirst false ise bu token, az önce basılan öbeğin bir parçası
      // (aradaki ya da öbeğin sonraki kelimesi) — ayrıca basmıyoruz.
      continue;
    }
    const token = tokens[i];
    const tokenLower = tokensLower[i];
    const fromDict = WORD_DICTIONARY[tokenLower];
    if(fromDict){
      result.push([token, fromDict]);
    } else {
      // Sözlükte de yoksa (nadir özel isim, sayı vb.) kelimeyi kendisiyle
      // gösteriyoruz - hiç göstermemekten iyidir, kullanıcı en azından
      // cümledeki her kelimeyi görür.
      result.push([token, null]);
    }
  }
  return result;
}

// Veri setindeki 800 cümlenin tamamında geçen kısaltmalar (i'm, don't, what's...)
// ile bunların açık halleri (I am, do not, what is...) dilbilgisi olarak
// eşdeğerdir. Kullanıcı hangisini yazarsa yazsın doğru sayılmalı, bu yüzden
// normalize() karşılaştırma öncesi kısaltmaları açık hale çeviriyor.
// Not: "he's"/"she's"/"it's"/"that's"/"there's"/"here's" veri setinde HER
// zaman "is" anlamında kullanılmış (hiçbiri "has" değil), "you'd" ise tek
// kullanımında "had" anlamında ("You'd better hurry") — bu eşlemeler veri
// setindeki gerçek kullanım taranarak belirlendi, genel bir varsayım değil.
// "o'clock" bilinçli olarak dahil edilmedi: bu bir zaman birimi ifadesidir,
// "of the clock" şeklinde açılması doğal değildir.
const CONTRACTIONS = {
  "i'm":"i am", "you're":"you are", "we're":"we are",
  "it's":"it is", "that's":"that is", "there's":"there is",
  "what's":"what is", "here's":"here is", "how's":"how is",
  "she's":"she is", "he's":"he is", "nothing's":"nothing is", "sky's":"sky is",
  "i'll":"i will", "we'll":"we will", "you'll":"you will",
  "i've":"i have", "you've":"you have",
  "i'd":"i would", "you'd":"you had",
  "don't":"do not", "doesn't":"does not", "didn't":"did not",
  "can't":"cannot", "couldn't":"could not", "won't":"will not",
  "shouldn't":"should not", "isn't":"is not", "haven't":"have not",
  "let's":"let us",
};
// Bazı kısaltmaların apostrofsuz hali ("were", "its", "well", "ill" gibi)
// İngilizcede zaten geçerli, sık kullanılan başka bir kelimedir. Bu
// kısaltmalarda apostrofu ZORUNLU tutuyoruz — yoksa kullanıcı gerçekten o
// kelimeyi yazdığında (örn. "Where were we?" cümlesindeki "were") bunu
// yanlışlıkla bir kısaltma gibi açıp cümleyi bozarız. Diğer kısaltmalarda
// ("dont", "whats", "im" gibi) apostrofsuz hali anlamlı bir kelime
// olmadığı için apostrofu isteğe bağlı bırakmak güvenlidir ve kullanıcının
// apostrof unutmasını tolere eder.
// Not: "cant" (ikiyüzlü/dini jargon), "wont" (alışkanlık, arkaik), "id"
// (psikoloji terimi) teknik olarak gerçek kelimelerdir ama bu uygulamanın
// bağlamında (günlük konuşma cümleleri yazan bir dil öğrencisi) fiilen hiç
// karşılaşılmaz; bunları riskli saymak, gerçek faydası olan apostrof
// toleransını gereksiz yere kısıtlardı. "were", "its", "well", "ill" ise
// tartışmasız yaygın kelimelerdir ve risk listesinde kalmalıdır. "let's"
// de listede kalıyor çünkü "lets" (izin verir anlamında, örn. "the app
// lets you...") günlük kullanımda gerçekten karşılaşılabilir.
const CONTRACTIONS_REQUIRE_APOSTROPHE = new Set([
  "we're", "it's", "i'll", "we'll", "let's",
]);
function expandContractions(str){
  let result = str;
  // Apostrof karakteri düz (') veya eğik (' ’) olabilir — özellikle mobil
  // klavyeler ve otomatik düzeltme genelde eğik apostrof üretir. Regex'te
  // ikisini de kapsayan bir karakter sınıfı kullanıyoruz, yoksa "I'm"
  // (eğik apostroflu) tanınmadan geçip yanlış sonuca yol açar.
  const APOSTROPHE_CLASS = "['\u2018\u2019]";
  for(const [contraction, expansion] of Object.entries(CONTRACTIONS)){
    const mustHaveApostrophe = CONTRACTIONS_REQUIRE_APOSTROPHE.has(contraction);
    const apostropheGroup = mustHaveApostrophe ? APOSTROPHE_CLASS : APOSTROPHE_CLASS+"?";
    const pattern = contraction.replace(/'/g, apostropheGroup);
    result = result.replace(new RegExp("\\b"+pattern+"\\b","gi"), expansion);
  }
  return result;
}
// Türkçe klavye / iOS gibi tarayıcıların otomatik büyük harf yapma özelliği bir
// cümlenin başındaki "i"yi Türkçe kurala göre büyütüp "İ" (noktalı büyük I,
// U+0130) üretebilir; bazı klavyeler de küçük "i" yerine noktasız "ı" (U+0131)
// yazabilir. Sorun şu: JS'in standart toLowerCase() metodu "İ" harfini TEK bir
// "i" karakterine değil, "i" + görünmez bir nokta işaretine (U+0307) çevirir -
// yani normalize edilen metin karakter olarak doğru cevaptaki düz "i" ile asla
// eşleşmez. Veri setindeki 800 cümlenin ~%34'ü tam olarak "I " ile başladığı
// için (I want..., I need..., I'm... vb.) bu, düzeltilmezse doğru yazılmış
// cevapların önemli bir kısmının yanlış sayılmasına yol açar. Bu yüzden "İ" ve
// "ı"yı, İngilizce bağlamda her ikisi de kullanıcının kastettiği düz "i"/"I"
// harfine karşılık geldiğinden, standart toLowerCase() çağrılmadan ÖNCE düz
// "i"ye çeviriyoruz.
function turkishSafeLower(str){
  return str.replace(/[İIı]/g, "i").toLowerCase();
}
function normalize(str){
  return expandContractions(turkishSafeLower(str).trim())
    .replace(/[.!?,]/g,"")
    .replace(/['’]/g,"") // kalan apostroflar (o'clock gibi) için farkı yok say
    .replace(/\s+/g," ");
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// Bir metni, HTML onclick="..." özniteliği İÇİNE güvenle gömülebilecek
// tek-tırnaklı bir JS string literaline çevirir. Hem JS kaçışlarını
// (\, ', satır sonları) hem de HTML özniteliği kaçışlarını (" ve &) uygular.
function jsStr(str){
  const jsEscaped = String(str)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "");
  const htmlSafe = jsEscaped.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  return "'" + htmlSafe + "'";
}

/* ============================================================
   SESLENDİRME (Web Speech API — tarayıcı yerleşik TTS)
   ============================================================ */
const speechSupported = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
let cachedEnglishVoice = null;
let voicesReady = false;
// Otomatik (gecikmeli) ses çağrılarını (teach fazı, recall/practice feedback'i) takip eder.
// Kullanıcı bir sonraki karta/faza çok hızlı geçerse, önceki fazdan kalan
// bekleyen otomatik ses çağrısı iptal edilir; yoksa yanlış anda, yanlış
// cümleyi seslendirip kafa karıştırabilirdi (bkz. pendingAutoSpeakTimer kullanımları).
let pendingAutoSpeakTimer = null;
function scheduleAutoSpeak(text, btnElGetter, delay){
  clearTimeout(pendingAutoSpeakTimer);
  pendingAutoSpeakTimer = setTimeout(() => {
    const btnEl = typeof btnElGetter === "function" ? btnElGetter() : btnElGetter;
    speak(text, btnEl);
  }, delay);
}

function primeVoices(){
  if(!speechSupported) return;
  const voices = window.speechSynthesis.getVoices();
  if(voices && voices.length > 0){
    cachedEnglishVoice =
      voices.find(v => v.lang === "en-US") ||
      voices.find(v => v.lang === "en-GB") ||
      voices.find(v => v.lang && v.lang.startsWith("en")) ||
      null;
    voicesReady = true;
  }
}
if(speechSupported){
  primeVoices();
  // Çoğu tarayıcıda sesler asenkron yükleniyor; hazır olunca tekrar dene.
  if("onvoiceschanged" in window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = primeVoices;
  }
}

function speak(text, btnEl){
  if(!speechSupported){
    alert("Bu tarayıcı sesli okumayı desteklemiyor. Chrome, Edge veya Safari'nin güncel bir sürümünü deneyebilirsin.");
    return;
  }
  if(!voicesReady) primeVoices();

  window.speechSynthesis.cancel(); // önceki konuşma varsa kes, üst üste binmesin

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = cachedEnglishVoice ? cachedEnglishVoice.lang : "en-US";
  if(cachedEnglishVoice) utter.voice = cachedEnglishVoice;
  utter.rate = 0.9; // öğrenci için biraz yavaş
  utter.pitch = 1;

  if(btnEl){
    btnEl.classList.add("speaking");
    utter.onend = () => btnEl.classList.remove("speaking");
    utter.onerror = () => btnEl.classList.remove("speaking");
  }
  window.speechSynthesis.speak(utter);
}

function speakBtn(text, btnEl){
  speak(text, btnEl || null);
}

/* ============================================================
   KONUŞMA TANIMA (Web Speech API — SpeechRecognition, konuşmadan metne)
   ============================================================ */
// Chrome/Edge (Chromium) ve Safari'de webkitSpeechRecognition prefix'iyle
// mevcut; Firefox'ta yok. Bulunamıyorsa mikrofon butonu hiç gösterilmez,
// kullanıcı sorunsuz şekilde klavyeyle yazmaya devam eder.
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechRecognitionSupported = !!SpeechRecognitionAPI;
let activeRecognition = null; // aynı anda birden fazla dinleme başlamasın diye

// onResult(transcript): tanınan metni alacak geri çağırım.
// onStateChange(state): "listening" | "idle" | "error" — buton görselini güncellemek için.
function startVoiceInput(onResult, onStateChange){
  if(!speechRecognitionSupported){
    if(onStateChange) onStateChange("error", "Bu tarayıcı sesli girişi desteklemiyor.");
    return;
  }
  if(activeRecognition){
    // zaten dinliyorsa tekrar tıklanmışsa durdur (aç/kapa davranışı)
    activeRecognition.stop();
    return;
  }
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = "en-US";
  recognition.continuous = false; // tek bir cümle/ifade sonrası otomatik dursun, sürekli dinlemesin
  recognition.interimResults = false; // sadece kesin sonucu al, ara tahminleri gösterme
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { if(onStateChange) onStateChange("listening"); };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if(onResult) onResult(transcript);
    // Bazı tarayıcılarda (continuous=false olsa bile) sonuç alındıktan sonra
    // servis kendiliğinden kapanmayabiliyor — MDN'nin kendi örnek kodu bile
    // onresult'tan sonra ayrıca stop() çağırmayı öneriyor. Mikrofonun arka
    // planda açık kalmaması için burada açıkça durduruyoruz.
    recognition.stop();
  };
  recognition.onerror = (event) => {
    // event.error resmi W3C spesifikasyonunda tanımlı sabit kodlardan biri
    // (no-speech, audio-capture, not-allowed, network, service-not-allowed,
    // aborted, language-not-supported). Kullanıcıya neden çalışmadığını
    // anlamlı bir Türkçe mesajla açıklıyoruz — sessizce başarısız olmak
    // yerine, çünkü sebep tarayıcıdan tarayıcıya çok farklı olabiliyor
    // (izin reddi, mikrofon donanımı yok, internet yok, vb.).
    const code = event && event.error;
    let message;
    switch(code){
      case "not-allowed":
      case "service-not-allowed":
        message = "Mikrofon izni verilmedi. Tarayıcı adres çubuğundaki kilit/mikrofon simgesinden izin verebilirsin.";
        break;
      case "no-speech":
        message = "Ses algılanmadı. Tekrar dene ve mikrofona yakın, net konuş.";
        break;
      case "audio-capture":
        message = "Mikrofon bulunamadı. Cihazında çalışan bir mikrofon olduğundan emin ol.";
        break;
      case "network":
        message = "Sesli tanıma için internet bağlantısı gerekiyor. Bu özellik çevrimdışı çalışmaz.";
        break;
      case "aborted":
        message = null; // kullanıcı kendi durdurdu, hata mesajı göstermeye gerek yok
        break;
      default:
        message = "Sesli giriş şu an çalışmadı. Tekrar deneyebilir ya da klavyeyle yazabilirsin.";
    }
    if(onStateChange) onStateChange("error", message);
    // W3C spesifikasyonu onerror ve onend'i birbirinden bağımsız event'ler
    // olarak tanımlıyor - onerror tetiklendiğinde onend'in de tetikleneceği
    // garanti değil (tarayıcıya göre değişebilir). activeRecognition'ı
    // burada da temizliyoruz ki onend hiç gelmese bile kullanıcı bir dahaki
    // mikrofon tıklamasında "zaten dinliyor" koruması yüzünden takılıp
    // kalmasın (bkz. startVoiceInput'un en başındaki if(activeRecognition) kontrolü).
    activeRecognition = null;
  };
  recognition.onend = () => {
    activeRecognition = null;
    if(onStateChange) onStateChange("idle");
  };

  activeRecognition = recognition;
  try{
    recognition.start();
  }catch(e){
    // Bazı tarayıcılarda üst üste hızlı start() çağrıları hata fırlatabilir;
    // sessizce idle durumuna dön, kullanıcı tekrar deneyebilir.
    activeRecognition = null;
    if(onStateChange) onStateChange("error", "Sesli giriş başlatılamadı. Tekrar dene.");
  }
}
// Bir ekrandan diğerine geçerken (örn. Practice'te mikrofon açıkken Ders'e
// geçilirse) önceki ekrandan kalan aktif dinlemeyi kapatır. Bu olmadan,
// startVoiceInput'un "zaten dinliyorsa durdur" korumasına takılıp yeni
// ekranda mikrofon hiç başlamayabilir — üstelik eski dinleme de arka planda
// gereksiz yere açık kalmış olur.
function stopActiveVoiceInput(){
  if(activeRecognition){
    activeRecognition.stop();
  }
}

// Mikrofon hata mesajını, sayfanın tamamını yeniden çizmeden (ki bu mikrofon
// buton state'ini bozabilir) doğrudan ilgili küçük alana yazar. message null
// ise alanı temizler (önceki hata artık geçerli değil - örn. yeni bir
// deneme başarılı oldu).
function renderMicError(elementId, message){
  const el = document.getElementById(elementId);
  if(!el) return;
  el.innerHTML = message ? `<div class="mic-error-text">${escapeHtml(message)}</div>` : "";
}

function defaultProgress(){
  return {
    learned: {},
    mistakes: {},
    dailyLog: {},
    settings: { dailyNewCount: 8 }
  };
}

let progress = defaultProgress();
let saveTimer = null;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      progress = Object.assign(defaultProgress(), parsed);
    }
  }catch(e){
    console.warn("İlerleme yüklenemedi, sıfırdan başlanıyor.", e);
    progress = defaultProgress();
  }
}

function saveProgress(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }catch(e){
      console.warn("İlerleme kaydedilemedi.", e);
      alert("Uyarı: İlerleme tarayıcıya kaydedilemedi. Depolama dolu olabilir.");
    }
  }, 300);
}

function getNextNewId(){
  for(let i=1;i<=800;i++){ if(!progress.learned[i]) return i; }
  return 601;
}
function getCurrentStageIndex(){
  const nextId = getNextNewId();
  const idx = stageOf(Math.min(nextId,800));
  return idx === -1 ? STAGES.length-1 : idx;
}
function getDueReviews(){
  const today = todayStr();
  const due = [];
  for(const idStr of Object.keys(progress.learned)){
    const rec = progress.learned[idStr];
    if(rec.nextReview && rec.nextReview <= today) due.push(Number(idStr));
  }
  return due.sort((a,b)=>a-b);
}
// SM-2 algoritması (Anki/SuperMemo'nun kullandığı, 1987'den beri kanıtlanmış
// aralıklı tekrar yöntemi). Sabit bir merdiven yerine her cümlenin kendi
// "ease factor"ü (kolaylık katsayısı) tutulur: sürekli doğru bilinen bir
// cümlenin ease'i yükselir ve aralığı katlanarak açılır (1→6→15→37 gün gibi,
// cümleye özel); sık yanlış yapılan bir cümlenin ease'i düşer ve aralığı kısa
// kalıp sık tekrar eder. Böylece 800 cümlenin her biri kendi zorluk geçmişine
// göre kişisel bir hızda ilerler, hepsi aynı sabit merdivende yürümez.
const SM2_INITIAL_EASE = 2.5;
const SM2_MIN_EASE = 1.3;
const SM2_EASE_BONUS_CORRECT = 0.15;
const SM2_EASE_PENALTY_WRONG = 0.2;
function scheduleNext(rec, wasCorrect){
  let ease = rec.ease || SM2_INITIAL_EASE;
  let interval = rec.interval || 0; // gün cinsinden mevcut aralık
  let repetitions = rec.repetitions || 0; // art arda doğru sayısı

  if(wasCorrect){
    ease = ease + SM2_EASE_BONUS_CORRECT;
    repetitions += 1;
    if(repetitions === 1) interval = 1;
    else if(repetitions === 2) interval = 6;
    else interval = Math.round(interval * ease);
  } else {
    ease = Math.max(SM2_MIN_EASE, ease - SM2_EASE_PENALTY_WRONG);
    repetitions = 0;
    interval = 0; // yanlış bilinen cümle aynı gün (bugün) tekrar kuyruğuna düşer
  }

  const nextReviewDate = addDaysStr(todayStr(), interval);
  return {
    ease, interval, repetitions,
    nextReview: nextReviewDate,
  };
}
function getPatternSiblings(id){
  const s = findSentence(id);
  if(!s) return [];
  const patternStarters = ["i want","i need","i have","i'm","can you","i feel","this is","i like","let's","i'll"];
  const enLower = s.en.toLowerCase();
  const matchedStarter = patternStarters.find(p => enLower.startsWith(p));
  if(!matchedStarter) return [];
  return SENTENCES.filter(o => o.id !== id && o.en.toLowerCase().startsWith(matchedStarter) && Math.abs(o.id-id) < 60).slice(0,2);
}

function exportProgress(){
  const blob = new Blob([JSON.stringify(progress, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ingilizce800_yedek_" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById("import-file").click();
}
function importProgress(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.learned) throw new Error("Geçersiz dosya");
      if(confirm("Mevcut ilerlemenin üzerine yedekteki ilerleme yüklenecek. Devam edilsin mi?")){
        progress = Object.assign(defaultProgress(), parsed);
        saveProgress();
        renderAll();
        alert("İlerleme başarıyla geri yüklendi.");
      }
    }catch(err){
      alert("Bu dosya okunamadı. Geçerli bir yedek dosyası seçtiğinden emin ol.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function setView(name, skipLessonInit){
  // Hangi ekrana geçilirse geçilsin, önceki ekrandan kalan açık mikrofon
  // varsa kapatıyoruz — kullanıcı Practice'te mikrofona basıp cevap vermeden
  // başka bir sekmeye geçse bile mikrofon arka planda açık kalmasın.
  stopActiveVoiceInput();
  currentView = name;
  VIEWS.forEach(v => {
    document.getElementById("view-"+v).classList.toggle("hidden", v !== name);
  });
  if(name === "lesson" && !skipLessonInit) initLesson();
  if(name === "lesson" && skipLessonInit) renderLesson(); // lessonState zaten çağıran tarafından kuruldu (örn. startStageReview)
  if(name === "practice") initPractice();
  if(name === "mistakes") renderMistakes();
  if(name === "stats") renderStats();
  if(name === "browse") renderBrowse();
  if(name === "home") renderHome();
  updateTopbar();
  window.scrollTo(0,0);
}
function goHome(){ setView("home"); }

function updateTopbar(){
  const learnedCount = Object.keys(progress.learned).length;
  const pct = Math.round((learnedCount/800)*100);
  document.getElementById("brand-count").textContent = learnedCount;
  document.getElementById("brand-pct").textContent = pct;
  document.getElementById("progress-fill").style.width = pct + "%";

  const streak = computeStreak();
  const badge = document.getElementById("streak-badge");
  if(streak.count > 0){
    badge.classList.add("show");
    badge.classList.toggle("at-risk", streak.atRisk);
    document.getElementById("streak-count").textContent = streak.count;
    badge.title = streak.atRisk
      ? "Bugün çalışmazsan serin bozulacak — kaybetme!"
      : "Bugün serini korudun, aferin!";
  } else {
    badge.classList.remove("show","at-risk");
  }
}

function renderAll(){
  updateTopbar();
  setView(currentView);
}

      <div class="hero-buttons">
        <button class="btn-primary" onclick="setView('lesson')">${escapeHtml(heroBtnLabel)}</button>
        ${dueToday>0 ? `<button class="btn-secondary" onclick="setView('practice')">Tekrar Zamanı (${dueToday})</button>` : ""}
      </div>
      <div class="daily-count-row">
        Günlük yeni cümle sayısı:
        <select class="daily-count-select" onchange="setDailyNewCount(this.value)">
          ${[5,8,10,15,20].map(n => `<option value="${n}" ${n===dailyCount?"selected":""}>${n}</option>`).join("")}
        </select>
      </div>
      ${dailyCount >= 15 ? `<p class="daily-count-warning">Not: Yüksek bir sayı seçtin. Her yeni cümle önümüzdeki günlerde tekrar olarak geri dönecek, bu yüzden ${dailyCount} cümle/gün birkaç gün içinde tekrar yükünü belirgin şekilde artırabilir. Sürdürülebilir bulmuyorsan 8-10'a düşürmek daha rahat bir tempo sağlar.</p>` : ""}
      <div class="week-strip">${weekHtml}</div>
    </div>

    ${previewHtml ? `
    <details class="panel preview-details" style="margin-bottom:20px;">
      <summary class="subheading preview-summary">Bugün Bunları Göreceksin</summary>
      <div class="preview-list">${previewHtml}</div>
    </details>` : ""}

    <div class="card-grid card-grid-compact">
      <button class="stat-card" style="border-top-color:#2B4C6F" onclick="setView('practice')">
        <div class="stat-card-value" style="color:#2B4C6F">${dueToday}</div>
        <div class="stat-card-title">Bugün Tekrar</div>
      </button>
      <button class="stat-card" style="border-top-color:#8B2E2E" onclick="setView('mistakes')">
        <div class="stat-card-value" style="color:#8B2E2E">${mistakeCount}</div>
        <div class="stat-card-title">Zayıf Nokta</div>
      </button>
      <button class="stat-card" style="border-top-color:#5B7553" onclick="setView('browse')">
        <div class="stat-card-value" style="color:#5B7553">800</div>
        <div class="stat-card-title">Tüm Cümleler</div>
      </button>
      <button class="stat-card" style="border-top-color:#B08D3E" onclick="setView('stats')">
        <div class="stat-card-value" style="color:#B08D3E">%${pct}</div>
        <div class="stat-card-title">Karne</div>
      </button>
    </div>

    <div class="section-head-row">
      <h3 class="subheading">Ders Yolu</h3>
      ${!lessonPathExpanded ? `<button class="section-link" onclick="toggleLessonPath(true)">Tüm aşamaları göster →</button>` : `<button class="section-link" onclick="toggleLessonPath(false)">Daralt</button>`}
    </div>
    <div class="lesson-path">
  `;

  // Mobilde varsayılan olarak sadece şu an aktif olan aşama ve (varsa) bir
  // önceki tamamlanmış aşama gösterilir; kullanıcı "Tüm aşamaları göster"e
  // basarsa 10 aşamanın tamamı açılır. Bu, sayfa yüklendiğinde kullanıcının
  // asıl ilgilendiği "neredeyim / sırada ne var" bilgisini öne çıkarır,
  // henüz gelmediği ya da çoktan bitirdiği aşamaların uzun listesiyle
  // boğmadan.
  const visibleStageIndices = lessonPathExpanded
    ? STAGES.map((_,i) => i)
    : [...new Set([Math.max(0, currentStageIdx-1), currentStageIdx])];

  STAGES.forEach((s,i) => {
    if(!visibleStageIndices.includes(i)) return;
    const inStage = Object.keys(progress.learned).filter(id => id>=s.from && id<=s.to).length;
    const total = s.to - s.from + 1;
    const isActive = i === currentStageIdx;
    const isComplete = inStage === total;
    const side = i % 2 === 0 ? "side-left" : "side-right";
    const stateCls = isComplete ? "is-complete" : (isActive ? "is-current" : "");
    const clickable = isComplete || isActive;
    const onclick = isComplete ? `startStageReview(${i})` : (isActive ? `setView('lesson')` : "");
    const circleInner = isComplete ? "✓" : String(i+1);
    html += `
      <div class="path-row ${side}">
        <div class="path-node ${stateCls}" ${clickable ? `onclick="${onclick}" role="button"` : ""}>
          <div class="path-node-circle">${circleInner}</div>
          <div class="path-node-label">${escapeHtml(s.name)}</div>
          <div class="path-node-sub">${inStage}/${total}${isComplete ? " · tekrar için dokun" : ""}</div>
        </div>
      </div>
    `;
  });

  html += `</div>

    <div class="build-version-tag">Sürüm: 2026-09-11 · Ana sayfa mobil için sadeleştirildi (halka grafik yerine kompakt çubuk, Ders Yolu varsayılan daraltılmış, kelime kelime çeviri kapsamı tamamlandı)</div>`;
  document.getElementById("view-home").innerHTML = html;
}

/* ============================================================
   DERS EKRANI (Yeni cümle öğretimi)
   ============================================================ */
function initLesson(){
  clearTimeout(pendingAutoSpeakTimer); // başka bir ekrandan (örn. Practice) kalan bekleyen ses varsa iptal
  stopActiveVoiceInput(); // başka bir ekrandan kalan açık mikrofon varsa kapat
  const startId = getNextNewId();
  const dailyCount = (progress.settings && progress.settings.dailyNewCount) || 8;
  // Bir ders, içinde bulunduğu bölümün sınırını AŞMAZ: kalan cümle sayısı
  // günlük hedeften azsa, o bölüm bitene kadar sadece kalanlar alınır.
  // Böylece bölümler gerçekten ayrı, sırayla geçilen birimler olur — bir
  // ders asla iki bölümü karışık öğretmez.
  const stageIdxForCap = stageOf(Math.min(startId,800));
  const stageEnd = stageIdxForCap === -1 ? 800 : STAGES[stageIdxForCap].to;
  const cap = Math.min(startId + dailyCount - 1, stageEnd, 800);
  const ids = [];
  for(let i=startId; i<=cap; i++) ids.push(i);
  lessonState = { mode:"new", ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null, micError:null };
  renderLesson();
}

// Tamamlanmış bir aşamayı, ilerlemeye (progress.learned / spaced-repetition
// takvimine) DOKUNMADAN yeniden Ders akışından (teach->recognize->build->recall)
// geçirmek için kullanılır. stageIdx: STAGES dizisindeki 0-tabanlı indeks.
function startStageReview(stageIdx){
  clearTimeout(pendingAutoSpeakTimer);
  const stage = STAGES[stageIdx];
  const ids = [];
  for(let i=stage.from; i<=stage.to; i++) ids.push(i);
  lessonState = { mode:"review", stageIdx, ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null, micError:null };
  setView("lesson", true); // true: initLesson() atlanır, lessonState üzerine yazılmaz
}

// Zayıf Noktalar listesindeki tüm cümleleri (en çok hata yapılandan aza
// doğru) Ders akışıyla (teach->recognize->build->recall) çalıştırır.
// "review" modu gibi progress.learned'ın tekrar takvimine dokunmaz, ama
// ondan farklı olarak: recall'da DOĞRU cevaplanan bir cümle mistakes
// listesinden tamamen SİLİNİR (gerçek "tamamlama" hissi vermek için).
// Yanlış cevaplanırsa mevcut mekanizma zaten count'u artırır, liste kalır.
function startMistakesReview(){
  clearTimeout(pendingAutoSpeakTimer);
  const ids = Object.keys(progress.mistakes)
    .map(Number)
    .sort((a,b) => (progress.mistakes[b].count - progress.mistakes[a].count));
  if(ids.length === 0) return; // buton zaten sadece liste doluyken gösteriliyor, ekstra güvenlik
  lessonState = { mode:"mistakes", ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null, mistakesResolvedCount:0, micError:null };
  setView("lesson", true);
}

function renderLesson(){
  const el = document.getElementById("view-lesson");
  if(!lessonState || lessonState.ids.length === 0){
    el.innerHTML = `
      <div class="panel">
        <h2 class="panel-title">800 Cümleyi Tamamladın! 🎉</h2>
        <p class="panel-text">Artık yeni cümle yok. Şimdi sıra tekrar ve pekiştirmede — "Tekrar Zamanı" bölümüne göz at.</p>
        <button class="btn-primary" onclick="setView('practice')">Tekrara Git</button>
      </div>`;
    return;
  }

  const { ids, idx, phase } = lessonState;

  if(phase === "done"){
    if(!lessonState.doneCelebrated){
      lessonState.doneCelebrated = true;
      fireConfetti(45);
    }
    let listHtml = "";
    ids.forEach(id => {
      const s = findSentence(id);
      listHtml += `<div class="done-item"><span class="done-item-en">${escapeHtml(s.en)}</span><span class="done-item-tr">${escapeHtml(s.tr)}</span></div>`;
    });
    let title, desc, showPracticeBtn;
    if(lessonState.mode === "section-mistakes"){
      const resolved = lessonState.mistakesResolvedCount || 0;
      const remaining = ids.length - resolved;
      const stageName = STAGES[lessonState.stageIdx].name;
      title = "Bölüm Tamamlandı 🎉";
      desc = remaining === 0
        ? `"${stageName}" bölümünü bitirdin ve o bölümde en çok zorlandığın ${ids.length} cümleyi de artık doğru biliyorsun!`
        : `"${stageName}" bölümünü bitirdin. En çok zorlandığın cümlelerden ${resolved}/${ids.length}'ini bu turda düzelttin, kalanı zayıf noktalarında takipte kalmaya devam ediyor.`;
      showPracticeBtn = true;
    } else if(lessonState.mode === "mistakes"){
      const resolved = lessonState.mistakesResolvedCount || 0;
      const remaining = ids.length - resolved;
      title = "Zayıf Noktalar Oturumu Tamamlandı";
      desc = remaining === 0
        ? `Harika! ${ids.length} zayıf noktanın tamamını doğru bildin, defter artık bomboş.`
        : `${resolved} cümleyi doğru bilip listeden çıkardın. ${remaining} cümle hâlâ zayıf noktalarında — istersen hemen tekrar çalışabilirsin.`;
      showPracticeBtn = false;
    } else if(lessonState.mode === "review"){
      title = "Aşama Tekrarı Tamamlandı";
      desc = `${ids.length} cümleyi tekrar çalıştın: ${ids[0]}–${ids[ids.length-1]}. Bu bir pratik oturumuydu; ilerleme ve tekrar takvimin değişmedi.`;
      showPracticeBtn = false;
    } else {
      title = "Bugünkü Ders Tamamlandı";
      desc = `${ids.length} yeni cümle öğrendin: ${ids[0]}–${ids[ids.length-1]}. Bunlar bugün ve yarın kısa tekrarla karşına çıkacak.`;
      showPracticeBtn = true;
    }
    el.innerHTML = `
      <div class="panel">
        <div class="done-stamp">✓</div>
        <h2 class="panel-title" style="text-align:center">${title}</h2>
        <p class="panel-text" style="text-align:center">${desc}</p>
        <div class="done-list">${listHtml}</div>
        <div class="hero-buttons">
          <button class="btn-primary" onclick="setView('home')">Ana Sayfaya Dön</button>
          ${showPracticeBtn ? `<button class="btn-secondary" onclick="setView('practice')">Şimdi Pratik Yap</button>` : ""}
          ${(lessonState.mode === "mistakes" || lessonState.mode === "section-mistakes") && (ids.length - (lessonState.mistakesResolvedCount||0)) > 0 ? `<button class="btn-secondary" onclick="setView('mistakes')">Zayıf Noktalara Bak</button>` : ""}
        </div>
      </div>`;
    return;
  }

  const sentence = findSentence(ids[idx]);
  const stageIdx = stageOf(sentence.id);
  const stage = STAGES[stageIdx];
  // Review modunda breadcrumb'a ek etiket koyup kullanıcının normal ders mi
  // yoksa serbest tekrar mı yaptığını her an net görmesini sağlıyoruz.
  const modeTag = lessonState.mode === "review" ? " · Tekrar" : (lessonState.mode === "mistakes" ? " · Zayıf Nokta" : (lessonState.mode === "section-mistakes" ? " · Bölüm Tekrarı" : ""));

  if(phase === "teach"){
    const siblings = getPatternSiblings(sentence.id);
    let wordsHtml = "";
    const fullBreakdown = getFullWordBreakdown(sentence);
    fullBreakdown.forEach(([text, meaning]) => {
      if(meaning === null){
        // Sözlükte de veri setinde de karşılığı olmayan (genelde özel isim
        // ya da çok nadir kelime) - boş bırakmak yerine kelimeyi göster,
        // ama Türkçe karşılığı olmadığını görsel olarak da belli et.
        wordsHtml += `<div class="word-item"><span class="word-en">${escapeHtml(text)}</span><span class="word-dash">—</span><span class="word-no-meaning">(çeviri yok)</span></div>`;
      } else {
        wordsHtml += `<div class="word-item"><span class="word-en">${escapeHtml(text)}</span><span class="word-dash">—</span><span>${escapeHtml(meaning)}</span></div>`;
      }
    });
    let patternHtml = "";
    if(siblings.length > 0){
      let rows = "";
      siblings.forEach(sib => {
        rows += `<div class="pattern-row-with-speak"><div class="pattern-en-wrap"><button class="speak-btn speak-btn-sm" onclick="speakBtn(${jsStr(sib.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button><span class="pattern-en">${escapeHtml(sib.en)}</span></div><span class="pattern-tr">${escapeHtml(sib.tr)}</span></div>`;
      });
      patternHtml = `<div class="pattern-box"><div class="pattern-title">Aynı kalıptan yeni cümleler türet</div>${rows}</div>`;
    }
    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
      <div class="lesson-head">
        <div class="lesson-breadcrumb">Aşama ${stageIdx+1} · ${escapeHtml(stage.name)}${modeTag}</div>
        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">English</span>
        <div class="card-en-row">
          <div class="card-en">${escapeHtml(sentence.en)}</div>
          <button class="speak-btn" id="teach-main-speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
        </div>
        <div class="card-divider"></div>
        <div class="card-field"><span class="card-label">Türkçesi</span><div class="card-tr">${escapeHtml(sentence.tr)}</div></div>
        <div class="card-field"><span class="card-label">Türkçe okunuşu</span><div class="card-pron">${escapeHtml(sentence.pron)}</div></div>
        <div class="card-field"><span class="card-label">Kelime kelime</span><div class="word-list">${wordsHtml}</div></div>
        <div class="card-field"><span class="card-label">Doğal kullanım</span><div class="card-usage">${escapeHtml(sentence.usage)}</div></div>
        ${patternHtml}
        <button class="btn-primary" onclick="lessonGoToRecognize()">Öğrendim, Devam Et</button>
      </div>`;
    // Kart açılır açılmaz cümleyi otomatik seslendir (öğrenciler duyarak öğrenir;
    // muadil uygulamalarda kart gösterimiyle ses birlikte gelir, elle tıklamaya gerek kalmaz).
    scheduleAutoSpeak(sentence.en, () => document.getElementById('teach-main-speak-btn'), 150);
    return;
  }

  if(phase === "recognize"){
    // Isınma turu: kullanıcı henüz yazmaya zorlanmadan, doğru Türkçe anlamı
    // çoktan seçmeli olarak tanısın. Duolingo/Memrise'deki "mark the correct
    // meaning" adımının karşılığı — tam üretimden önceki düşük çabalı adım.
    if(!lessonState.recognizeOptions){
      lessonState.recognizeOptions = buildRecognizeOptions(sentence);
      lessonState.recognizeSelected = null;
    }
    const opts = lessonState.recognizeOptions;
    const selected = lessonState.recognizeSelected;

    let optsHtml = "";
    opts.forEach((opt, i) => {
      let cls = "choice-btn";
      if(selected !== null){
        if(opt.isCorrect) cls += " choice-correct";
        else if(i === selected) cls += " choice-wrong";
      }
      optsHtml += `<button class="${cls}" ${selected!==null?"disabled":""} onclick="lessonCheckRecognize(${i})">${escapeHtml(opt.text)}</button>`;
    });

    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
      <div class="lesson-head">
        <div class="lesson-breadcrumb">Aşama ${stageIdx+1} · ${escapeHtml(stage.name)} · Tanıma${modeTag}</div>
        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">Bu cümle Türkçe ne demek?</span>
        <div class="card-en-row">
          <div class="card-en" style="font-size:20px">${escapeHtml(sentence.en)}</div>
          <button class="speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
        </div>
        <div class="choice-list">${optsHtml}</div>
        ${selected !== null ? `<button class="btn-primary" onclick="lessonGoToBuild()">Devam Et</button>` : ""}
      </div>`;
    return;
  }

  if(phase === "build"){
    // Orta adım: cümleyi karışık kelime parçalarından doğru sıraya dizmek.
    // Boş bir kutuya yazmadan önce cümle yapısını "inşa ederek" içselleştirme —
    // Duolingo'nun "arrange all the words" egzersiziyle aynı mantık.
    if(!lessonState.buildTiles){
      const built = buildWordTiles(sentence.en);
      lessonState.buildTiles = built.tiles;       // karışık sıradaki kelime parçaları [{id,text,used}]
      lessonState.buildAnswer = [];                 // kullanıcının seçtiği sıradaki tile id'leri
      lessonState.buildCorrectOrder = built.correctOrder;
      lessonState.buildFeedback = null;
    }
    const tiles = lessonState.buildTiles;
    const answer = lessonState.buildAnswer;
    const fb = lessonState.buildFeedback;

    const answerRowHtml = answer.length === 0
      ? `<span class="build-placeholder">Kelimelere dokunarak cümleyi buraya sırayla diz…</span>`
      : answer.map(tid => {
          const t = tiles.find(x => x.id === tid);
          return `<button class="tile-btn tile-used" onclick="lessonRemoveTile(${tid})" ${fb?"disabled":""}>${escapeHtml(t.text)}</button>`;
        }).join(" ");

    const bankHtml = tiles.filter(t => !answer.includes(t.id)).map(t =>
      `<button class="tile-btn" onclick="lessonAddTile(${t.id})" ${fb?"disabled":""}>${escapeHtml(t.text)}</button>`
    ).join(" ");

    let feedbackHtml = "";
    if(fb){
      const cls = fb === "correct" ? "feedback-good" : "feedback-bad";
      const label = fb === "correct" ? `<span class="praise-pop">${escapeHtml(lessonState.praiseWord || "Doğru sırada!")}</span> 👍` : "Doğru sıralama bu — bir dahaki sefere dikkat et.";
      feedbackHtml = `
        <div class="feedback-box ${cls}">
          <div class="feedback-answer-row">
            <div class="feedback-answer">${escapeHtml(sentence.en)}</div>
            <button class="speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
          </div>
          <div class="feedback-label">${label}</div>
          <button class="btn-primary" onclick="lessonGoToRecall()">Şimdi Kendin Yaz</button>
        </div>`;
    }

    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
      <div class="lesson-head">
        <div class="lesson-breadcrumb">Aşama ${stageIdx+1} · ${escapeHtml(stage.name)} · Cümle Dizme${modeTag}</div>
        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">Türkçesi</span>
        <div class="card-tr" style="margin-bottom:14px">${escapeHtml(sentence.tr)}</div>
        <p class="recall-hint">Kelimeleri doğru sırada seçerek İngilizce cümleyi oluştur.</p>
        <div class="build-answer-row">${answerRowHtml}</div>
        <div class="build-bank">${bankHtml}</div>
        ${!fb ? `
          <div class="hero-buttons">
            <button class="btn-primary" onclick="lessonCheckBuild()" ${answer.length===0?"disabled":""}>Kontrol Et</button>
            <button class="btn-ghost" onclick="lessonResetBuild()">Baştan Başla</button>
          </div>` : ""}
        ${feedbackHtml}
      </div>`;
    return;
  }

  if(phase === "recall"){
    const fb = lessonState.feedback;
    let feedbackHtml = "";
    if(fb){
      const cls = fb === "correct" ? "feedback-good" : "feedback-bad";
      const label = fb === "correct" ? `<span class="praise-pop">${escapeHtml(lessonState.praiseWord || "Doğru!")}</span> 👍` : (fb === "wrong" ? "Doğrusu bu — not edildi, tekrar karşına çıkacak." : "Cevap gösterildi.");
      const stageBanner = lessonState.stageJustCompleted
        ? `<div class="stage-complete-banner">🎉 <strong>${escapeHtml(lessonState.stageJustCompleted)}</strong> aşamasını tamamladın!</div>`
        : "";
      const nextLabel = (idx+1 < ids.length) ? "Sıradaki Cümle" : "Dersi Bitir";
      feedbackHtml = `
        <div class="feedback-box ${cls}">
          <div class="feedback-answer-row">
            <div class="feedback-answer">${escapeHtml(sentence.en)}</div>
            <button class="speak-btn" id="recall-feedback-speak-btn" onclick="speakBtn(${jsStr(sentence.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
          </div>
          <div class="feedback-label">${label}</div>
          ${stageBanner}
          <button class="btn-primary" onclick="lessonNextCard()">${nextLabel}</button>
        </div>`;
    }
    el.innerHTML = `
      <div class="lesson-exit-row"><button class="lesson-exit-link" onclick="setView('home')">← Ana Sayfaya Dön</button></div>
      <div class="lesson-head">
        <div class="lesson-breadcrumb">Aşama ${stageIdx+1} · ${escapeHtml(stage.name)}${modeTag}</div>
        <div class="lesson-counter">${idx+1} / ${ids.length}</div>
      </div>
      <div class="teach-card">
        <span class="card-label">Türkçesi</span>
        <div class="card-tr" style="margin-bottom:14px">${escapeHtml(sentence.tr)}</div>
        <p class="recall-hint">İngilizcesini yazmayı dene. Emin değilsen tahmin et, olmadı "Cevabı Göster"e bas.</p>
        <div class="answer-input-row">
          <input type="text" class="text-input" id="lesson-answer-input" placeholder="İngilizcesini buraya yaz…"
            autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"
            value="${escapeHtml(lessonState.answer)}" ${fb ? "disabled" : ""}
            oninput="lessonState.answer=this.value; lessonSyncCheckBtn()" onkeydown="if(event.key==='Enter' && !lessonState.feedback) lessonCheckAnswer()">
