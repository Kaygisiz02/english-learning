/* ---- RECOGNIZE (çoktan seçmeli tanıma) ---- */
// Hedef cümlenin doğru Türkçesini, aynı aşamadan alınmış 3 yanlış seçenekle
// karıştırır. Yanlışlar aynı stage'den seçilir ki zorluk seviyesi tutarlı olsun
// (çok farklı bir aşamadan gelen çeviri bariz şekilde elenebilir olurdu).
function buildRecognizeOptions(sentence){
  const stageIdx = stageOf(sentence.id);
  const stage = STAGES[stageIdx];
  const pool = SENTENCES.filter(s => s.id !== sentence.id && s.id >= stage.from && s.id <= stage.to && s.tr !== sentence.tr);
  const wrongs = [];
  const poolCopy = pool.slice();
  while(wrongs.length < 3 && poolCopy.length > 0){
    const i = Math.floor(Math.random() * poolCopy.length);
    wrongs.push(poolCopy.splice(i,1)[0]);
  }
  const options = wrongs.map(w => ({ text: w.tr, isCorrect: false }));
  options.push({ text: sentence.tr, isCorrect: true });
  // Fisher-Yates karıştırma
  for(let i = options.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return options;
}
function lessonCheckRecognize(i){
  if(lessonState.recognizeSelected !== null) return; // zaten cevaplandı
  lessonState.recognizeSelected = i;
  if(lessonState.recognizeOptions[i] && lessonState.recognizeOptions[i].isCorrect) fireConfetti(14);
  renderLesson();
}

/* ---- BUILD (kelime dizme) ---- */
// Cümleyi kelimelere ayırıp karıştırır. Noktalama işaretlerini ayrı tile
// yapmadan kelimenin sonuna yapıştırıyoruz (örn. "water." tek parça) —
// yoksa nokta/soru işareti tek başına anlamsız bir parça olurdu.
function buildWordTiles(sentenceEn){
  const words = sentenceEn.split(" ").filter(w => w.length > 0);
  const tiles = words.map((w, i) => ({ id: i, text: w }));
  const correctOrder = tiles.map(t => t.id);
  // Karışık sırada göster (en az bir kelime yanlış konumdaysa yeterli;
  // tek kelimelik cümlelerde karıştırmaya gerek yok)
  const shuffled = tiles.slice();
  if(shuffled.length > 1){
    let attempts = 0;
    do{
      for(let i = shuffled.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      attempts++;
    } while(shuffled.every((t,i) => t.id === correctOrder[i]) && attempts < 10);
  }
  return { tiles: shuffled, correctOrder };
}
function lessonAddTile(tileId){
  if(lessonState.buildFeedback) return;
  lessonState.buildAnswer.push(tileId);
  renderLesson();
}
function lessonRemoveTile(tileId){
  if(lessonState.buildFeedback) return;
  const idx = lessonState.buildAnswer.lastIndexOf(tileId);
  if(idx !== -1) lessonState.buildAnswer.splice(idx, 1);
  renderLesson();
}
function lessonResetBuild(){
  if(lessonState.buildFeedback) return;
  lessonState.buildAnswer = [];
  renderLesson();
}
function lessonCheckBuild(){
  const isCorrect = lessonState.buildAnswer.length === lessonState.buildCorrectOrder.length &&
    lessonState.buildAnswer.every((id, i) => id === lessonState.buildCorrectOrder[i]);
  lessonState.buildFeedback = isCorrect ? "correct" : "wrong";
  if(isCorrect){ lessonState.praiseWord = randomPraise(); fireConfetti(18); }
  renderLesson();
}

/* ---- RECALL (serbest yazma) — mevcut mantık, artık learned burada işaretleniyor ---- */
function lessonMarkLearned(id, wasCorrect){
  // Güvenlik: cümle daha önce öğrenilmişse (örn. ileride bu fonksiyon başka
  // bir yerden de çağrılırsa) üzerine yazıp ilerlemesini sıfırlamıyoruz.
  // Böylece bu invariant çağıran koda değil, fonksiyonun kendisine bağlı olur.
  if(progress.learned[id]) return;
  const today = todayStr();
  // İlk öğrenmede de scheduleNext ile aynı SM-2 mantığını kullanıyoruz:
  // doğru cevaplandıysa ilk tekrar 1 gün sonraya açılır (repetitions=1),
  // yanlış/gösterildiyse bugün (interval=0) kalır. Böylece Ders'teki ilk
  // cevap da Pratik'teki tekrarlarla aynı algoritmayla aralığı etkiliyor.
  const schedule = scheduleNext({}, !!wasCorrect); // boş rec: ease/interval/repetitions varsayılan başlangıç değerlerinden başlar
  progress.learned[id] = {
    firstLearned: today, ...schedule, correctStreak: wasCorrect ? 1 : 0, timesWrong: wasCorrect ? 0 : 1
  };
  if(!progress.dailyLog[today]) progress.dailyLog[today] = { newCount:0, reviewCount:0 };
  progress.dailyLog[today].newCount += 1;
  saveProgress();
  updateTopbar();
}

function lessonCheckAnswer(){
  const sentence = findSentence(lessonState.ids[lessonState.idx]);
  const correct = normalize(lessonState.answer) === normalize(sentence.en);
  lessonState.feedback = correct ? "correct" : "wrong";
  lessonState.stageJustCompleted = null;
  lessonState.stageJustCompletedIdx = null;
  if(correct){ lessonState.praiseWord = randomPraise(); fireConfetti(20); }
  if(!correct){
    const m = progress.mistakes[sentence.id] || { count:0 };
    progress.mistakes[sentence.id] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: lessonState.answer };
  } else if(lessonState.mode === "mistakes" || lessonState.mode === "section-mistakes"){
    // "Zayıf Noktaları Çalış" VE bölüm-sonu mini tekrarında doğru cevap =
    // tamamlandı sayılır, cümle listeden tamamen kalkar. Bu, sadece bir
    // sonraki tekrarı ertelemekten farklı: kullanıcı gerçekten "bitirdim"
    // hissi alır.
    delete progress.mistakes[sentence.id];
    lessonState.mistakesResolvedCount = (lessonState.mistakesResolvedCount || 0) + 1;
  }
  // Sadece normal ("new") modda: recall adımına kadar geldiyse cümleyi
  // öğrenilmiş sayıp tekrar kuyruğuna ekliyoruz. Doğru cevap aralığı
  // 1 güne açar, yanlış cevap aynı gün (0) kademesinde tutar.
  // "review" (tamamlanmış aşamayı tekrar çalışma) ve "mistakes" (zayıf
  // noktaları çalışma) modlarında ise ilerlemeye ve spaced-repetition
  // takvimine HİÇ dokunmuyoruz — bu ikisi de serbest pratik, mevcut
  // tekrar programını bozmamalı.
  if(lessonState.mode === "new"){
    const st = STAGES[stageOf(sentence.id)];
    const totalInStage = st.to - st.from + 1;
    const learnedBefore = Object.keys(progress.learned).filter(id => id>=st.from && id<=st.to).length;
    lessonMarkLearned(sentence.id, correct);
    const learnedAfter = Object.keys(progress.learned).filter(id => id>=st.from && id<=st.to).length;
    if(learnedBefore < totalInStage && learnedAfter === totalInStage){
      lessonState.stageJustCompleted = st.name;
      lessonState.stageJustCompletedIdx = stageOf(sentence.id);
      fireConfetti(55); // aşama tamamlandı — büyük kutlama
    }
  }
  saveProgress();
  renderLesson();
}
function lessonReveal(){
  lessonState.feedback = "revealed";
  const sentence = findSentence(lessonState.ids[lessonState.idx]);
  // Cevap gösterildiyse kullanıcı bilmiyor demektir; yanlış cevap gibi ele
  // alıp aynı gün (0) kademesinde tutuyoruz ki cümle hemen tekrar karşısına
  // çıksın. Review/mistakes modlarında ise (yukarıdaki gerekçeyle) hiç
  // dokunmuyoruz. Not: mistakes modunda cevap gösterildiyse cümle listeden
  // SİLİNMEZ (kullanıcı gerçekten bilmiyordu, tamamlanmış sayılamaz).
  if(lessonState.mode === "new"){
    lessonMarkLearned(sentence.id, false);
  }
  saveProgress();
  renderLesson();
}
// Bir bölüm tam bitirildiğinde (son cümle de öğrenildiğinde) otomatik olarak
// devreye girer: o bölümde en çok hata yapılan (en fazla 10) cümleyi Ders
// akışıyla (teach->recognize->build->recall) tekrar çalıştırır. "mistakes"
// modu gibi doğru cevap cümleyi Zayıf Noktalar listesinden tamamen siler.
// Bölümde hiç hata kaydı yoksa (temiz geçildiyse) false döner, çağıran
// normal "Ders Tamamlandı" ekranına devam eder.
function startSectionMistakesReview(stageIdx){
  const stage = STAGES[stageIdx];
  const ids = Object.keys(progress.mistakes)
    .map(Number)
    .filter(id => id>=stage.from && id<=stage.to)
    .sort((a,b) => (progress.mistakes[b].count - progress.mistakes[a].count))
    .slice(0, 10);
  if(ids.length === 0) return false;
  lessonState = { mode:"section-mistakes", stageIdx, ids, idx:0, phase:"teach", answer:"", feedback:null, recognizeOptions:null, recognizeSelected:null, buildTiles:null, buildAnswer:[], buildCorrectOrder:null, buildFeedback:null, mistakesResolvedCount:0, micError:null };
  renderLesson();
  return true;
}

function lessonNextCard(){
  clearTimeout(pendingAutoSpeakTimer); // önceki karttan (recall feedback) kalan bekleyen ses varsa iptal
  lessonState.answer = "";
  lessonState.feedback = null;
  lessonState.recognizeOptions = null;
  lessonState.recognizeSelected = null;
  lessonState.buildTiles = null;
  if(lessonState.idx+1 < lessonState.ids.length){
    lessonState.idx += 1;
    lessonState.phase = "teach";
    renderLesson();
    return;
  }
  // Son karttı. "new" modda bir bölüm az önce tamamlandıysa, "Ders
  // Tamamlandı" ekranına geçmeden önce o bölümün en çok hata yapılan
  // cümlelerini otomatik bir mini tura sokuyoruz — ayrı, "toplu" bir Zayıf
  // Noktalar oturumu beklemek yerine, bölüm bitişine doğal olarak bağlı.
  if(lessonState.mode === "new" && lessonState.stageJustCompletedIdx != null){
    if(startSectionMistakesReview(lessonState.stageJustCompletedIdx)) return;
  }
  lessonState.phase = "done";
  renderLesson();
}

        ${(speechRecognitionSupported && !fb) ? `<button class="mic-btn" id="practice-mic-btn" onclick="practiceStartMic()" title="Konuşarak cevapla" aria-label="Konuşarak cevapla">🎤</button>` : ""}

function practiceStartMic(){

        // message null ise (örn. "aborted" - kullanıcı kendi durdurdu)

function practiceCheckAnswer(){
  const currentId = practiceState.queue[0];
  const sentence = findSentence(currentId);
  const correct = normalize(practiceState.answer) === normalize(sentence.en);
  practiceState.feedback = correct ? "correct" : "wrong";
  if(correct){ practiceState.praiseWord = randomPraise(); fireConfetti(20); }

  const rec = progress.learned[currentId] || {};
  // Cevap "doğru" çıkarsa, kullanıcı daha sonra "aslında bilmiyordum, şansa
  // denk geldi" diyip geri alabilsin diye, güncellemeden HEMEN ÖNCEKİ rec'i
  // ayrıca saklıyoruz. Geri alma, bu orijinal rec üzerinden "yanlış" olarak
  // yeniden zamanlanacak — böylece "doğruyu geri al, sonra yanlışı uygula"
  // gibi çift işlem yerine, hiç doğru cevaplanmamış gibi temiz bir hesaplama olur.
  practiceState.canUndo = correct;
  practiceState.preAnswerRec = correct ? Object.assign({}, rec) : null;
  practiceState.undoneId = correct ? currentId : null;

  const updatedSchedule = scheduleNext(rec, correct);
  progress.learned[currentId] = Object.assign({}, rec, updatedSchedule, {
    correctStreak: correct ? (rec.correctStreak||0)+1 : 0,
    timesWrong: correct ? (rec.timesWrong||0) : (rec.timesWrong||0)+1
  });

  if(!correct){
    const m = progress.mistakes[currentId] || { count:0 };
    progress.mistakes[currentId] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: practiceState.answer };
  }

  const today = todayStr();
  if(!progress.dailyLog[today]) progress.dailyLog[today] = { newCount:0, reviewCount:0 };
  progress.dailyLog[today].reviewCount += 1;

  saveProgress();
  updateTopbar();

  practiceState.correct += correct ? 1 : 0;
  practiceState.wrong += correct ? 0 : 1;
  renderPractice();
}
function practiceUndoCorrect(){
  // Kullanıcı "Doğru" işaretlenen bir cevabı geri alıp "aslında bilmiyordum"
  // diyor. Sadece az önce BU cevap için (başka bir karta geçilmeden) çağrılabilir.
  if(!practiceState.canUndo || practiceState.undoneId === null) return;
  const currentId = practiceState.undoneId;
  const originalRec = practiceState.preAnswerRec || {};

  // Az önceki "doğru" güncellemesini saymadan, orijinal rec üzerinden
  // doğrudan "yanlış" olarak yeniden zamanla.
  const updatedSchedule = scheduleNext(originalRec, false);
  progress.learned[currentId] = Object.assign({}, originalRec, updatedSchedule, {
    correctStreak: 0,
    timesWrong: (originalRec.timesWrong||0)+1
  });

  const m = progress.mistakes[currentId] || { count:0 };
  progress.mistakes[currentId] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: practiceState.answer + " (sonradan 'bilmiyordum' olarak düzeltildi)" };

  // Oturum sayaçlarını da düzelt: bu cevap artık doğru değil, yanlış sayılıyor.
  practiceState.correct = Math.max(0, practiceState.correct - 1);
  practiceState.wrong += 1;
  practiceState.feedback = "undone";
  practiceState.canUndo = false;

  saveProgress();
  updateTopbar();
  renderPractice();
}
function practiceReveal(){
  practiceState.feedback = "revealed";
  const currentId = practiceState.queue[0];
  const sentence = findSentence(currentId);
  const rec = progress.learned[currentId] || {};
  const updatedSchedule = scheduleNext(rec, false);
  progress.learned[currentId] = Object.assign({}, rec, updatedSchedule, { timesWrong: (rec.timesWrong||0)+1 });
  const m = progress.mistakes[currentId] || { count:0 };
  progress.mistakes[currentId] = { count:m.count+1, lastWrong: todayStr(), yourAnswer: "(bilmiyorum dedi)" };
  practiceState.wrong += 1;
  saveProgress();
  updateTopbar();
  renderPractice();
}
function practiceNextItem(){
  clearTimeout(pendingAutoSpeakTimer); // önceki cümlenin feedback sesi kalmışsa iptal
  practiceState.answer = "";
  practiceState.feedback = null;
  // Bir sonraki karta geçince "Aslında Bilmiyordum" artık bu karta ait
  // olmadığı için geri alma imkanını da sıfırlıyoruz.
  practiceState.canUndo = false;
  practiceState.preAnswerRec = null;
  practiceState.undoneId = null;
  practiceState.queue.shift();
  renderPractice();
}

/* ============================================================
   ZAYIF NOKTALAR
   ============================================================ */
function renderMistakes(){
  const el = document.getElementById("view-mistakes");
  const entries = Object.keys(progress.mistakes).map(id => {
    const data = progress.mistakes[id];
    return Object.assign({ id:Number(id) }, data, { sentence: findSentence(Number(id)) });
  }).sort((a,b) => b.count - a.count);

  if(entries.length === 0){
    el.innerHTML = `
      <div class="panel">
        <h2 class="panel-title">Zayıf Nokta Yok</h2>
        <p class="panel-text">Henüz hiç hata kaydı yok — ya çok yeni başladın ya da harika gidiyorsun!</p>
        <button class="btn-primary" onclick="setView('home')">Ana Sayfaya Dön</button>
      </div>`;
    return;
  }

  let listHtml = "";
  entries.forEach(e => {
    const yourAnswerHtml = e.yourAnswer ? `<div class="mistake-your">Son cevabın: "${escapeHtml(e.yourAnswer)}"</div>` : "";
    listHtml += `
      <div class="mistake-card">
        <div class="mistake-count">${e.count}×</div>
        <div class="mistake-body">
          <div class="mistake-en">${escapeHtml(e.sentence ? e.sentence.en : "")}</div>
          <div class="mistake-tr">${escapeHtml(e.sentence ? e.sentence.tr : "")}</div>
          ${yourAnswerHtml}
        </div>
      </div>`;
  });

  el.innerHTML = `
    <div class="panel">
      <h2 class="panel-title">Zayıf Noktalar Defteri</h2>
      <p class="panel-text">En çok hata yapılan cümleler üstte. Bir cümleyi burada doğru cevaplarsan listeden tamamen çıkar.</p>
      <button class="btn-primary" style="margin-bottom:18px" onclick="startMistakesReview()">Zayıf Noktaları Çalış (${entries.length})</button>
      <div class="mistake-list">${listHtml}</div>
    </div>`;
}

/* ============================================================
   İSTATİSTİKLER / KARNE
   ============================================================ */
function renderStats(){
  const el = document.getElementById("view-stats");
  const learnedCount = Object.keys(progress.learned).length;
  let totalMistakes = 0;
  Object.values(progress.mistakes).forEach(m => totalMistakes += m.count);
  const logDays = Object.keys(progress.dailyLog).sort();
  let totalReviews = 0;
  Object.values(progress.dailyLog).forEach(d => totalReviews += (d.reviewCount||0));

  let stageRows = "";
  STAGES.forEach((s,i) => {
    const inStage = Object.keys(progress.learned).filter(id => id>=s.from && id<=s.to).length;
    const total = s.to - s.from + 1;
    stageRows += `
      <div class="stage-detail-row">
        <div class="stage-detail-name">${i+1}. ${escapeHtml(s.name)}</div>
        <div class="stage-detail-bar-track"><div class="stage-detail-bar-fill" style="width:${(inStage/total)*100}%"></div></div>
        <div class="stage-detail-count">${inStage}/${total}</div>
      </div>`;
  });

  el.innerHTML = `
    <div class="panel">
      <h2 class="panel-title">İlerleme Karnesi</h2>
      <div class="card-grid">
        <button class="stat-card" style="border-top-color:#8B2E2E" onclick="setView('browse')">
          <div class="stat-card-value" style="color:#8B2E2E">${learnedCount}</div>
          <div class="stat-card-title">Öğrenilen Cümle</div>
          <div class="stat-card-sub">/ 800</div>
        </button>
        <button class="stat-card" style="border-top-color:#2B4C6F" onclick="setView('practice')">
          <div class="stat-card-value" style="color:#2B4C6F">${totalReviews}</div>
          <div class="stat-card-title">Toplam Tekrar</div>
          <div class="stat-card-sub">pratik oturumu</div>
        </button>
        <button class="stat-card" style="border-top-color:#B08D3E" onclick="setView('mistakes')">
          <div class="stat-card-value" style="color:#B08D3E">${totalMistakes}</div>
          <div class="stat-card-title">Toplam Hata</div>
          <div class="stat-card-sub">işaretlendi</div>
        </button>
        <button class="stat-card" style="border-top-color:#5B7553" onclick="setView('home')">
          <div class="stat-card-value" style="color:#5B7553">${logDays.length}</div>
          <div class="stat-card-title">Ders Günü</div>
          <div class="stat-card-sub">gün çalışıldı</div>
        </button>
      </div>
      <h3 class="subheading">Aşama Bazlı İlerleme</h3>
      <div class="stage-detail-list">${stageRows}</div>
      <button class="btn-secondary" onclick="setView('home')">Ana Sayfaya Dön</button>
    </div>`;
}

/* ============================================================
   TÜM CÜMLELERE GÖZ AT
   ============================================================ */
function renderBrowse(){
  const el = document.getElementById("view-browse");

  // innerHTML yeniden yazılınca input focus/imleç konumunu kaybedebilir
  // (arama kutusuna yazarken özellikle rahatsız edici). Render öncesi
  // mevcut odak ve imleç konumunu not edip render sonrası geri veriyoruz.
  const prevInput = document.getElementById("browse-search-input");
  const hadFocus = prevInput && document.activeElement === prevInput;
  const prevSelStart = hadFocus ? prevInput.selectionStart : null;
  const prevSelEnd = hadFocus ? prevInput.selectionEnd : null;

  const stage = STAGES[browseState.stageFilter];
  let list = SENTENCES.filter(s => s.id >= stage.from && s.id <= stage.to);
  if(browseState.query.trim()){
    const q = browseState.query.toLowerCase();
    list = list.filter(s => s.en.toLowerCase().includes(q) || s.tr.toLowerCase().includes(q));
  }

  let tabsHtml = "";
  STAGES.forEach((s,i) => {
    tabsHtml += `<button class="stage-tab ${i===browseState.stageFilter?'active':''}" onclick="browseSetStage(${i})">${i+1}</button>`;
  });

  let rowsHtml = "";
  list.forEach(s => {
    const isLearned = !!progress.learned[s.id];
    rowsHtml += `
      <div class="browse-row">
        <div class="browse-id">${s.id}</div>
        <div class="browse-body">
          <div class="browse-en-row">
            <button class="speak-btn speak-btn-sm" onclick="speakBtn(${jsStr(s.en)}, this)" title="Sesli dinle" aria-label="Sesli dinle">🔊</button>
            <div class="browse-en">${escapeHtml(s.en)}</div>
          </div>
          <div class="browse-tr">${escapeHtml(s.tr)}</div>
        </div>
        ${isLearned ? '<div class="browse-check">✓</div>' : ''}
      </div>`;
  });
  if(list.length === 0) rowsHtml = `<p class="panel-text">Bu aramaya uygun cümle bulunamadı.</p>`;

  el.innerHTML = `
    <div class="panel">
      <h2 class="panel-title">Tüm Cümleler</h2>
      <input type="text" class="text-input" id="browse-search-input" placeholder="Cümle ara (İngilizce ya da Türkçe)…"
        value="${escapeHtml(browseState.query)}" oninput="browseSetQuery(this.value)">
      <div class="stage-tabs">${tabsHtml}</div>
      <div class="browse-list">${rowsHtml}</div>
      <button class="btn-secondary" onclick="setView('home')">Ana Sayfaya Dön</button>
    </div>`;

  if(hadFocus){
    const newInput = document.getElementById("browse-search-input");
    if(newInput){
      newInput.focus();
      // imleç konumunu da geri koy, yoksa yazarken imleç hep sona atlar
      if(prevSelStart !== null) newInput.setSelectionRange(prevSelStart, prevSelEnd);
    }
  }
}
function setDailyNewCount(v){
  const n = Number(v);
  if(!progress.settings) progress.settings = {};
  progress.settings.dailyNewCount = n;
  saveProgress();
  // Ana Sayfa'yı hemen yeniden çiz ki yüksek sayı uyarısı (varsa) anında
  // görünsün — aksi halde kullanıcı başka bir ekrana gidip dönene ya da
  // sayfayı yenileyene kadar eski (güncellenmemiş) hâli görürdü.
  renderHome();
  // Not: initLesson her çağrıldığında güncel değeri okur; devam eden bir dersi etkilemez.
}

function toggleLessonPath(expand){
  lessonPathExpanded = expand;
  renderHome();
}

let browseQueryTimer = null; // arama debounce'u için; sekme değişince de sıfırlanır
function browseSetStage(i){
  browseState.stageFilter = i;
  clearTimeout(browseQueryTimer); // bekleyen arama render'ı varsa iptal, çakışma olmasın
  renderBrowse();
}
function browseSetQuery(v){
  browseState.query = v;
  // Her tuşta tüm listeyi yeniden filtrelemek/çizmek yerine kısa bir
  // bekleme sonrası render ediyoruz; yazarken akıcılık artıyor.
  clearTimeout(browseQueryTimer);
  browseQueryTimer = setTimeout(renderBrowse, 150);
}

/* ============================================================
   BAŞLANGIÇ
   ============================================================ */
window.addEventListener("DOMContentLoaded", function(){
  loadProgress();
  document.getElementById("loading-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  setView("home");
});
</script>
